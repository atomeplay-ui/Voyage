<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mes voyages</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: auto; padding: 16px; background: #f5f5f5; }
  a { color: inherit; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  button, .btn { font: inherit; padding: 8px 12px; border: 1px solid #ccc; border-radius: 8px; background: #fff; cursor: pointer; }
  .btn input { display: none; }
  .rec { background: #e33; color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
  .item { background: #fff; border-radius: 8px; padding: 6px; position: relative; }
  .item img, .item video, .item audio { width: 100%; border-radius: 6px; display: block; }
  .item pre { white-space: pre-wrap; margin: 0; font-family: inherit; }
  .del { position: absolute; top: 4px; right: 4px; padding: 2px 6px; }
  textarea { width: 100%; box-sizing: border-box; min-height: 80px; font: inherit; }
  ul { padding: 0; list-style: none; } li a { display: block; background: #fff; padding: 12px; margin: 6px 0; border-radius: 8px; text-decoration: none; }
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
import { upload } from 'https://esm.sh/@vercel/blob@2.8.0/client';

const app = document.getElementById('app');
let pw = localStorage.getItem('pw') || prompt('Mot de passe');
localStorage.setItem('pw', pw);

async function api(q = '', opts = {}) {
  const r = await fetch('/api/trips' + q, { ...opts, headers: { 'x-password': pw, 'content-type': 'application/json' } });
  if (r.status === 401) { localStorage.removeItem('pw'); location.reload(); }
  return r.json();
}
const esc = s => s.replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);

async function showTrips() {
  const trips = await api();
  app.innerHTML = `<h1>Mes voyages</h1>
    <form class="bar" id="new"><input name="name" placeholder="Nouveau voyage" required><button>Créer</button></form>
    <ul>${trips.map(t => `<li><a href="#${encodeURIComponent(t)}">📁 ${esc(t)}</a></li>`).join('')}</ul>`;
  app.querySelector('#new').onsubmit = async e => {
    e.preventDefault();
    const name = e.target.name.value.trim();
    await api('', { method: 'POST', body: JSON.stringify({ name }) });
    location.hash = encodeURIComponent(name);
  };
}

async function showTrip(trip) {
  app.innerHTML = `<a href="#">← Voyages</a> <h1>${esc(trip)}</h1>
    <div class="bar">
      <label class="btn">📷 Photo<input type="file" accept="image/*" capture="environment"></label>
      <label class="btn">🎥 Vidéo<input type="file" accept="video/*" capture="environment"></label>
      <button id="rec">🎙️ Audio</button>
      <label class="btn">📁 Importer<input type="file" multiple accept="image/*,video/*,audio/*,text/plain"></label>
      <button id="delTrip">🗑️ Supprimer le voyage</button>
    </div>
    <form id="note"><textarea name="text" placeholder="Écrire une note…"></textarea><button>📝 Enregistrer la note</button></form>
    <p id="status"></p>
    <div class="grid" id="items"></div>`;

  const status = app.querySelector('#status');
  async function send(files) {
    for (const [i, f] of [...files].entries()) {
      status.textContent = `Envoi ${i + 1}/${files.length} : ${f.name}…`;
      await upload(`trips/${trip}/${f.name}`, f, { access: 'public', handleUploadUrl: '/api/upload', clientPayload: pw });
    }
    status.textContent = '';
    loadItems();
  }
  app.querySelectorAll('input[type=file]').forEach(inp => inp.onchange = () => send(inp.files).finally(() => inp.value = ''));

  app.querySelector('#note').onsubmit = e => {
    e.preventDefault();
    const text = e.target.text.value.trim();
    if (!text) return;
    e.target.reset();
    send([new File([text], `note-${Date.now()}.txt`, { type: 'text/plain' })]);
  };

  let rec;
  const recBtn = app.querySelector('#rec');
  recBtn.onclick = async () => {
    if (rec) return rec.stop();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    rec = new MediaRecorder(stream);
    const chunks = [];
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const type = rec.mimeType.split(';')[0];
      const ext = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'weba';
      rec = null;
      recBtn.textContent = '🎙️ Audio'; recBtn.className = '';
      send([new File(chunks, `audio-${Date.now()}.${ext}`, { type })]);
    };
    rec.start();
    recBtn.textContent = '⏹️ Arrêter'; recBtn.className = 'rec';
  };

  app.querySelector('#delTrip').onclick = async () => {
    if (!confirm(`Supprimer « ${trip} » et tout son contenu ?`)) return;
    await api(`?trip=${encodeURIComponent(trip)}`, { method: 'DELETE' });
    location.hash = '';
  };

  async function loadItems() {
    const blobs = (await api(`?trip=${encodeURIComponent(trip)}`))
      .sort((a, b) => a.uploadedAt.localeCompare(b.uploadedAt));
    const box = app.querySelector('#items');
    box.innerHTML = '';
    for (const b of blobs) {
      const ext = b.pathname.split('.').pop().toLowerCase();
      const el = document.createElement('div');
      el.className = 'item';
      if (/^(jpe?g|png|gif|webp|avif|heic)$/.test(ext)) el.innerHTML = `<a href="${b.url}" target="_blank"><img src="${b.url}" loading="lazy"></a>`;
      else if (/^(mp4|mov|webm|m4v)$/.test(ext)) el.innerHTML = `<video src="${b.url}" controls preload="metadata"></video>`;
      else if (/^(weba|m4a|mp3|wav|ogg|aac|opus)$/.test(ext)) el.innerHTML = `<audio src="${b.url}" controls></audio>`;
      else if (ext === 'txt') { el.innerHTML = '<pre></pre>'; fetch(b.url).then(r => r.text()).then(t => el.firstChild.textContent = t); }
      else el.innerHTML = `<a href="${b.url}" target="_blank">${esc(b.pathname.split('/').pop())}</a>`;
      const del = document.createElement('button');
      del.className = 'del'; del.textContent = '✕';
      del.onclick = async () => {
        if (!confirm('Supprimer ce média ?')) return;
        await api(`?url=${encodeURIComponent(b.url)}`, { method: 'DELETE' });
        el.remove();
      };
      el.append(del);
      box.append(el);
    }
  }
  loadItems();
}

const route = () => { const t = decodeURIComponent(location.hash.slice(1)); t ? showTrip(t) : showTrips(); };
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
