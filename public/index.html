<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef2f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07080c" media="(prefers-color-scheme: dark)">
<title>Mes voyages</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
  /* Style « Liquid Glass » : panneaux de verre translucides flottant sur un fond coloré */
  :root {
    --text: #0b0d12; --muted: rgba(11,13,18,.55);
    --accent: #007aff; --danger: #ff3b30;
    --glass: rgba(255,255,255,.52); --glass-strong: rgba(255,255,255,.72);
    --glass-border: rgba(255,255,255,.7); --glass-hi: rgba(255,255,255,.9); --glass-press: rgba(255,255,255,.55);
    --shadow: 0 10px 40px rgba(20,30,60,.16);
    --bg-base: #eef2f8; --blob1: #8ec5ff; --blob2: #ffb3d9; --blob3: #9ef0c4; --blob4: #ffd59e;
    --surface: #fff; --surface-line: rgba(0,0,0,.07); --card-shadow: 0 8px 24px rgba(20,30,60,.12);
    --top-h: 56px; --bar-h: 64px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #f2f4f8; --muted: rgba(242,244,248,.6); --accent: #0a84ff; --danger: #ff453a;
      --glass: rgba(40,44,54,.45); --glass-strong: rgba(40,44,54,.65);
      --glass-border: rgba(255,255,255,.14); --glass-hi: rgba(255,255,255,.22); --glass-press: rgba(255,255,255,.12);
      --shadow: 0 10px 40px rgba(0,0,0,.45);
      --bg-base: #07080c; --blob1: #1d4ed8; --blob2: #86198f; --blob3: #047857; --blob4: #b45309;
      --surface: #1c1f27; --surface-line: rgba(255,255,255,.07); --card-shadow: 0 8px 24px rgba(0,0,0,.45);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color: var(--text); background: var(--bg-base); min-height: 100vh; }
  /* Fond coloré fixe, visible à travers le verre */
  body::before { content: ''; position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(55% 45% at 12% 8%, var(--blob1), transparent 70%),
      radial-gradient(50% 40% at 92% 22%, var(--blob2), transparent 70%),
      radial-gradient(60% 45% at 20% 88%, var(--blob3), transparent 70%),
      radial-gradient(45% 40% at 88% 92%, var(--blob4), transparent 70%),
      var(--bg-base); }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }

  /* Matière verre partagée : réservée à la navigation et aux contrôles (règle Apple Liquid Glass) */
  .top, #drawer, #actions, #note, #toast, .tabs, .map-sheet {
    background: var(--glass);
    -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow: inset 0 1px 0 var(--glass-hi), inset 0 -1px 1px rgba(255,255,255,.06), var(--shadow);
  }
  /* Contenu (photos, notes, audios, messages) : surfaces opaques, pas de verre */
  .item:not(.audio), .ring, .welcome, .empty { background: var(--surface); border: 1px solid var(--surface-line); box-shadow: var(--card-shadow); }
  /* Verre interactif (façon iOS 26) : sous le doigt, le bouton grossit et s'illumine à l'endroit touché, puis rebondit */
  .pressed { transform: scale(1.08); transition: transform .25s cubic-bezier(.3,1.5,.5,1);
    background-image: radial-gradient(circle at var(--px, 50%) var(--py, 50%), rgba(255,255,255,.55), rgba(255,255,255,0) 70%) !important; }
  @media (prefers-reduced-motion: reduce) { .pressed { transform: none; } }

  /* Barre du haut flottante */
  .top { position: sticky; z-index: 10; top: calc(env(safe-area-inset-top) + 8px); margin: calc(env(safe-area-inset-top) + 8px) 10px 0;
    height: var(--top-h); padding: 0 6px; border-radius: 999px; display: flex; align-items: center; gap: 6px; }
  .top h1 { flex: 1; margin: 0; font-size: 17px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon { width: 44px; height: 44px; border-radius: 50%; font-size: 18px; display: grid; place-items: center; }
  .top .icon { background: var(--glass-press); }
  #delTrip { color: var(--danger); }

  /* Menu latéral en verre */
  #drawer { position: fixed; z-index: 30; top: calc(env(safe-area-inset-top) + 8px); bottom: calc(env(safe-area-inset-bottom) + 8px); left: 8px;
    width: min(80vw, 310px); border-radius: 32px; padding: 20px 14px; display: flex; flex-direction: column;
    background: var(--glass-strong); transform: translateX(calc(-100% - 16px)); transition: transform .35s cubic-bezier(.3,1.2,.5,1); }
  body.menu-open #drawer { transform: none; }
  #backdrop { position: fixed; z-index: 20; inset: 0; background: rgba(0,0,0,.18); opacity: 0; pointer-events: none; transition: opacity .3s; }
  body.menu-open #backdrop { opacity: 1; pointer-events: auto; }
  #drawer h2 { margin: 4px 8px 16px; font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  #drawer h2 i { color: var(--accent); }
  #new { display: flex; gap: 8px; margin-bottom: 14px; }
  /* Champ posé sur le menu en verre : fond simple, sans second verre */
  #new input { flex: 1; min-width: 0; height: 44px; padding: 0 16px; border-radius: 999px; outline: none;
    background: var(--glass-press); border: 1px solid var(--glass-border); box-shadow: inset 0 1px 2px rgba(0,0,0,.06); }
  #new input::placeholder { color: var(--muted); }
  #new button { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 18px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 6px 16px rgba(0,122,255,.35); }
  #tripList { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  #tripList a { display: flex; font-size: 16px; align-items: center; gap: 12px; padding: 13px 14px; margin-bottom: 4px; border-radius: 18px; text-decoration: none; color: inherit; transition: background .15s; }
  #tripList a i { color: var(--accent); width: 20px; text-align: center; }
  #tripList a:active { background: var(--glass-press); }
  #tripList a.active { background: var(--glass-hi); font-weight: 600; box-shadow: inset 0 1px 0 var(--glass-hi), 0 2px 10px rgba(0,0,0,.08); }
  .empty-list { color: var(--muted); padding: 12px; }

  /* Contenu */
  main { padding: 14px 10px calc(var(--bar-h) + env(safe-area-inset-bottom) + 32px); max-width: 900px; margin: auto; }
  .welcome, .empty { text-align: center; color: var(--muted); margin: 18vh auto 0; padding: 28px 24px; border-radius: 28px; max-width: 320px; }
  .welcome i { font-size: 48px; color: var(--accent); }
  #note { display: flex; gap: 8px; align-items: flex-end; border-radius: 26px; padding: 6px; margin-bottom: 12px; }
  #note textarea { flex: 1; border: 0; background: none; resize: none; min-height: 44px; max-height: 40vh; padding: 11px 12px; outline: none; field-sizing: content; }
  #note textarea::placeholder { color: var(--muted); }
  #note button { height: 44px; padding: 0 18px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 600;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 6px 16px rgba(0,122,255,.3); }
  /* Onglets Souvenirs / Carte */
  .tabs { display: flex; gap: 2px; width: max-content; margin: 0 auto 12px; padding: 3px; border-radius: 999px; }
  .tabs button { padding: 7px 20px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--muted); transition: background .2s, color .2s; }
  .tabs button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  /* Carte (contenu : surface opaque, pas de verre) */
  #map { height: calc(100dvh - 230px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); min-height: 320px; border-radius: 24px; overflow: hidden;
    isolation: isolate; border: 1px solid var(--surface-line); box-shadow: var(--card-shadow); background: var(--surface); }
  .map-empty { text-align: center; color: var(--muted); font-size: 14px; margin: 12px 20px 0; }
  /* Point sur la carte : miniatures façon Polaroid empilées en éventail, avec une pointe et le nombre de médias */
  .pin { width: 54px; height: 54px; cursor: pointer; }
  .pin::after { content: ''; position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%); border: 8px solid transparent; border-top-color: var(--surface); border-bottom: 0; }
  .pin .card { position: absolute; inset: 0; border-radius: 14px; background: var(--surface); border: 3px solid var(--surface); overflow: hidden;
    display: grid; place-items: center; box-shadow: 0 6px 16px rgba(0,0,0,.35);
    transform: rotate(calc(var(--i) * 11deg)) translateX(calc(var(--i) * 7px)); transform-origin: 50% 100%; transition: transform .25s cubic-bezier(.3,1.4,.5,1); }
  .pin:hover .card { transform: rotate(calc(var(--i) * 16deg)) translateX(calc(var(--i) * 12px)); } /* l'éventail s'ouvre au survol */
  .pin img, .sheet-item img, .sheet-item video { width: 100%; height: 100%; object-fit: cover; }
  .pin img { border-radius: 10px; }
  .pin i { color: var(--accent); font-size: 20px; }
  .pin em, .sheet-item em { font-style: normal; font-size: 8px; line-height: 1.25; padding: 4px; color: var(--text); overflow: hidden; align-self: start; }
  /* Aperçu du lieu : panneau en verre en bas de la carte, bande de miniatures qui défile */
  #mapTab { position: relative; }
  .map-sheet { position: absolute; left: 10px; right: 10px; bottom: 10px; padding: 10px 10px 12px; border-radius: 24px; z-index: 2;
    animation: sheet-in .35s cubic-bezier(.3,1.3,.5,1); }
  @keyframes sheet-in { from { transform: translateY(30px) scale(.96); opacity: 0; } }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin: 0 4px 8px 6px; font-size: 14px; }
  .sheet-head button { width: 30px; height: 30px; border-radius: 50%; background: rgba(127,127,127,.18); font-size: 13px; }
  .sheet-strip { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 2px; }
  .sheet-strip::-webkit-scrollbar { display: none; }
  .sheet-item { position: relative; flex: 0 0 92px; height: 92px; border-radius: 16px; overflow: hidden; scroll-snap-align: start; display: grid; place-items: center;
    background: var(--surface); border: 1px solid var(--surface-line); box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .sheet-item > i { font-size: 24px; color: var(--accent); }
  .sheet-item em { font-size: 11px; padding: 8px; text-align: left; }
  .sheet-item .badge { position: absolute; font-size: 14px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .pin b { position: absolute; top: -9px; right: -9px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; display: grid; place-items: center;
    background: var(--accent); color: #fff; font-size: 12px; border: 2px solid var(--surface); }
  /* Mention des sources : petit ⓘ en verre, qui se déplie au toucher */
  #map .maplibregl-ctrl-attrib { margin: 0 10px 10px 0; border-radius: 999px; font-size: 11px; color: var(--text);
    background: var(--glass); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 var(--glass-hi); }
  #map .maplibregl-ctrl-attrib a { color: inherit; }

  /* Mur de médias « en vrac » : photos flottantes, audios ronds, notes en cartes */
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); grid-auto-flow: dense; gap: 16px 12px; padding: 4px 4px 24px; }
  @media (min-width: 600px) { .grid { grid-template-columns: repeat(9, 1fr); } }
  .item { position: relative; border-radius: 22px; padding: 0; }
  .item.wide { grid-column: 1 / -1; padding: 14px 52px 14px 16px; }
  .item.float { grid-column: span var(--span, 3); padding: 6px; border-radius: 20px; margin-top: var(--dy, 0); align-self: start; }
  .item.float img, .item.float video { display: block; width: 100%; aspect-ratio: var(--ar, 1); object-fit: cover; border-radius: 14px; background: #000; cursor: zoom-in; }
  .item.float, .item.audio { transform: translateX(var(--dx, 0)) rotate(var(--r, 0deg)); animation: float var(--d, 6s) ease-in-out var(--delay, 0s) infinite; }
  .item.float:active, .item.float:hover { z-index: 3; }
  @keyframes float {
    0%, 100% { transform: translate(var(--dx, 0), 0) rotate(var(--r, 0deg)); }
    50% { transform: translate(var(--dx, 0), -7px) rotate(calc(var(--r, 0deg) * .6)); }
  }
  @media (prefers-reduced-motion: reduce) { .item.float, .item.audio { animation: none; } }
  .play-badge { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
    color: #fff; font-size: 16px; pointer-events: none; background: rgba(0,0,0,.3); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.35); }
  .play-badge i { margin-left: 3px; }

  /* Visionneuse plein écran */
  body.viewer-open { overflow: hidden; }
  /* Fond en verre dépoli : le voyage reste visible, flouté, derrière. --fade descend vers 0 quand on glisse pour fermer */
  @property --fade { syntax: '<number>'; inherits: true; initial-value: 1; }
  #viewer { --fade: 1; position: fixed; z-index: 55; inset: 0; color: #fff;
    background: rgba(12,14,22, calc(.5 * var(--fade)));
    -webkit-backdrop-filter: blur(calc(36px * var(--fade))) saturate(calc(100% + 80% * var(--fade)));
    backdrop-filter: blur(calc(36px * var(--fade))) saturate(calc(100% + 80% * var(--fade))); }
  #viewer .viewer-top, #viewer .viewer-nav { transition: opacity .2s; }
  #viewer.dragging .viewer-top, #viewer.dragging .viewer-nav { opacity: 0; }
  #viewerTrack { display: flex; height: 100%; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; overscroll-behavior: contain; scrollbar-width: none; }
  #viewerTrack::-webkit-scrollbar { display: none; }
  .slide { flex: 0 0 100%; height: 100%; scroll-snap-align: center; scroll-snap-stop: always; display: grid; place-items: center;
    padding: calc(env(safe-area-inset-top) + 64px) 12px calc(env(safe-area-inset-bottom) + 24px); min-height: 0; }
  .slide img, .slide video { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 18px;
    box-shadow: 0 24px 70px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.18); }
  .slide img { touch-action: pan-x; transform-origin: center; will-change: transform; } /* le pincement est géré par l'appli */
  .viewer-top { position: absolute; inset: 0 0 auto 0; padding: calc(env(safe-area-inset-top) + 10px) 14px 0; display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
  .viewer-top > * { pointer-events: auto; }
  #viewerClose, .viewer-top .spacer { width: 44px; height: 44px; border-radius: 50%; color: #fff; font-size: 20px; }
  #viewerCount { padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .viewer-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 50%; color: #fff; font-size: 18px; display: none; }
  #viewerPrev { left: 16px; } #viewerNext { right: 16px; }
  @media (hover: hover) { .viewer-nav { display: grid; place-items: center; } }

  /* Lecteur audio rond : anneau de progression + durée */
  .item.audio { grid-column: span 2; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 2px 0; align-self: center; }
  .ring { position: relative; width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; transition: box-shadow .3s; }
  .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 5; }
  .ring .track { stroke: color-mix(in srgb, var(--accent) 15%, transparent); }
  .ring .prog { stroke: var(--accent); stroke-linecap: round; stroke-dasharray: 238.76; stroke-dashoffset: 238.76; transition: stroke-dashoffset .25s linear; }
  .ring i { font-size: 22px; color: var(--accent); }
  .ring .fa-play { margin-left: 4px; }
  .item.audio.playing .ring { box-shadow: inset 0 1px 0 var(--glass-hi), 0 0 0 6px color-mix(in srgb, var(--accent) 18%, transparent), var(--shadow); }
  .item.audio .len { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); cursor: zoom-in; }
  .item.audio .del { top: -4px; right: calc(50% - 50px); width: 26px; height: 26px; font-size: 11px; }
  .item pre { margin: 0; white-space: pre-wrap; font-family: inherit; line-height: 1.45; }
  .item time { display: block; font-size: 12px; color: var(--muted); margin-top: 6px; }
  /* Note flottante : carte de verre avec guillemet, texte coupé au-delà de 8 lignes */
  .item.note { padding: 14px 14px 12px; border-radius: 22px; }
  .item.note > i { color: var(--accent); font-size: 16px; opacity: .8; }
  .item.note pre { margin-top: 6px; font-size: 14px; cursor: zoom-in; display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .item.note time { font-size: 11px; }
  .item.note .del { top: 6px; right: 6px; width: 26px; height: 26px; font-size: 11px; }
  /* Grand lecteur audio de la visionneuse */
  .audio-big { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .audio-big .ring { width: min(240px, 62vw); height: min(240px, 62vw); border-radius: 50%; display: grid; place-items: center; position: relative; }
  .audio-big .ring .track { stroke: rgba(255,255,255,.18); }
  .audio-big .ring .prog { stroke: #7cc0ff; }
  .audio-big .ring i { font-size: 58px; color: #fff; }
  .audio-big .ring .fa-play { margin-left: 10px; }
  .audio-big.playing .ring { box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 0 0 14px rgba(124,192,255,.15), 0 20px 60px rgba(0,0,0,.4); }
  .audio-big .len { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .audio-big time { font-size: 13px; opacity: .65; }
  .note-big { max-width: min(560px, 88vw); max-height: 100%; overflow-y: auto; padding: 24px 24px 18px; border-radius: 28px; }
  .note-big > i { color: #7cc0ff; font-size: 22px; }
  .note-big pre { margin: 10px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: inherit; font-size: 19px; line-height: 1.5; }
  .note-big time { display: block; margin-top: 14px; font-size: 13px; opacity: .65; }
  .del { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%; color: #fff; font-size: 13px;
    background: rgba(0,0,0,.28); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.3); }
  .item:is(.audio, .note, .wide) .del { color: var(--text); background: rgba(127,127,127,.16); border-color: var(--surface-line); -webkit-backdrop-filter: none; backdrop-filter: none; }
  .item.audio .del { background: var(--glass-strong); }
  .empty { grid-column: 1 / -1; }

  /* Barre d'actions flottante (capsule) */
  #actions { position: fixed; z-index: 10; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 14px); transform: translateX(-50%);
    display: flex; gap: 4px; padding: 6px; border-radius: 999px; }
  #actions > * { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 88px; padding: 7px 18px; border-radius: 999px; font-size: 11px; font-weight: 600; color: var(--text); }
  #actions i { font-size: 20px; height: 24px; display: grid; place-items: center; color: var(--accent); }
  /* Barre réduite quand on fait défiler vers le bas (comme la barre d'onglets d'iOS 26) : icônes seules, capsule plus petite */
  #actions, #actions > * { transition: padding .3s cubic-bezier(.3,1.3,.5,1), min-width .3s cubic-bezier(.3,1.3,.5,1), font-size .2s, gap .2s; }
  body.bar-min #actions { padding: 4px; }
  body.bar-min #actions > * { min-width: 46px; padding: 6px 10px; font-size: 0; gap: 0; }
  #actions b { font-weight: inherit; }
  #rec.on { background: var(--danger); color: #fff; animation: pulse 1.2s infinite; }
  #rec.on i { color: #fff; }
  @keyframes pulse { 50% { opacity: .65; } }
  #toast { position: fixed; z-index: 60; left: 50%; bottom: calc(var(--bar-h) + env(safe-area-inset-bottom) + 26px); transform: translateX(-50%);
    padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; max-width: 90vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--glass-strong); }
  [hidden] { display: none !important; }

  /* Caméra intégrée, façon appareil photo iOS (boutons en verre sombre) */
  #cam { position: fixed; z-index: 50; inset: 0; background: #000; color: #fff; display: flex; flex-direction: column;
    touch-action: none; user-select: none; -webkit-user-select: none; }
  .cam-glass { background: rgba(255,255,255,.14); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255,255,255,.22); box-shadow: inset 0 1px 0 rgba(255,255,255,.35); }
  .cam-top { position: absolute; z-index: 1; inset: 0 0 auto 0; padding: calc(env(safe-area-inset-top) + 10px) 14px 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .cam-top > div { display: flex; gap: 10px; }
  .cam-top > div:last-child { justify-content: flex-end; }
  .cam-top button { width: 44px; height: 44px; border-radius: 50%; color: #fff; font-size: 20px; }
  #camRec.on { background: var(--danger); border-color: transparent; animation: pulse 1.2s infinite; }
  #cam.rec #camRec { visibility: hidden; }
  #camTimer { font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 600; padding: 6px 14px; border-radius: 999px; }
  #cam[data-mode=photo] #camTimer { visibility: hidden; }
  #cam.rec #camTimer { background: var(--danger); border-color: transparent; }
  .cam-view { flex: 1; position: relative; overflow: hidden; }
  #camView { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .1s; }
  #cam.flash #camView { opacity: 0; }
  .cam-bottom { position: absolute; inset: auto 0 0 0; padding: 0 0 calc(env(safe-area-inset-bottom) + 24px); }
  .modes { display: flex; gap: 22px; height: 38px; align-items: center; transition: transform .3s ease; width: 100%; }
  .modes button { color: #fff; font-size: 13px; font-weight: 600; letter-spacing: .1em; padding: 6px 12px; border-radius: 999px; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .modes button.on { color: #ffd60a; background: rgba(0,0,0,.35); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  #cam.rec .modes { visibility: hidden; }
  .cam-row { display: flex; align-items: center; justify-content: space-between; margin: 12px 20px 0; padding: 12px 18px; border-radius: 999px; }
  #camImport { width: 50px; height: 50px; border-radius: 14px; background: rgba(255,255,255,.12) center / cover; border: 1.5px solid rgba(255,255,255,.7);
    display: grid; place-items: center; font-size: 20px; cursor: pointer; }
  #camImport.thumb i { display: none; }
  #camImport input { display: none; }
  #camFlip { width: 50px; height: 50px; border-radius: 50%; color: #fff; font-size: 20px; }
  #cam.rec #camImport, #cam.rec #camFlip { visibility: hidden; }
  #shutter { width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; padding: 4px; display: grid; place-items: center; }
  #shutter::after { content: ''; width: 100%; height: 100%; border-radius: 50%; background: #fff; transition: all .25s ease; }
  #shutter:active::after { transform: scale(.9); }
  #cam[data-mode=video] #shutter::after { background: var(--danger); }
  #cam.rec #shutter::after { width: 42%; height: 42%; border-radius: 6px; }
  /* Flash : éclair barré (désactivé), avec un « A » (auto), jaune (activé) */
  #camFlash { position: relative; display: grid; place-items: center; }
  #camFlash[data-flash=on] { color: #ffd60a; }
  #camFlash[data-flash=off]::after { content: ''; position: absolute; width: 24px; height: 2px; border-radius: 2px; background: #fff; transform: rotate(-45deg); box-shadow: 0 0 0 1.5px rgba(0,0,0,.35); }
  #camFlash[data-flash=auto]::after { content: 'A'; position: absolute; right: 7px; bottom: 6px; font-size: 10px; font-weight: 800; }
  #cam.screen-flash::after { content: ''; position: fixed; z-index: 10; inset: 0; background: #fff; }
  /* Sélecteur d'objectifs (0,5 · 1 · 2 · 3) : capsule en verre + « goutte » de verre sous l'objectif actif */
  .lenses { position: relative; display: flex; gap: 2px; width: max-content; margin: 0 auto 8px; padding: 3px; border-radius: 999px; touch-action: none;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22);
    -webkit-backdrop-filter: blur(18px) saturate(180%); backdrop-filter: blur(18px) saturate(180%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 1px rgba(255,255,255,.08), 0 6px 20px rgba(0,0,0,.25); }
  .lens-blob { position: absolute; left: 0; top: 3px; bottom: 3px; width: 28px; border-radius: 999px; pointer-events: none;
    background: radial-gradient(120% 90% at 30% 10%, rgba(255,255,255,.3), rgba(24,24,30,.88) 62%);
    box-shadow: inset 0 1px 1px rgba(255,255,255,.6), inset 0 -2px 4px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.3); }
  .lenses button { position: relative; min-width: 28px; height: 26px; padding: 0 5px; border-radius: 999px; background: none;
    color: rgba(255,255,255,.88); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .lenses button.on { color: #ffd60a; }
  #cam.rec .lenses.devices { visibility: hidden; }
  /* Pas de verre sur du verre : le bouton de bascule posé sur la barre en verre a un simple fond */
  .cam-row #camFlip { -webkit-backdrop-filter: none; backdrop-filter: none; background: rgba(255,255,255,.18); }
  /* Visionneuse (fond déjà en verre) : contrôles sans flou, note et lecteur audio en surfaces opaques */
  #viewer .cam-glass { -webkit-backdrop-filter: none; backdrop-filter: none; background: rgba(255,255,255,.16); }
  #viewer .note-big, #viewer .audio-big .ring { -webkit-backdrop-filter: none; backdrop-filter: none;
    background: rgba(24,27,35,.94); border: 1px solid rgba(255,255,255,.1); box-shadow: 0 24px 70px rgba(0,0,0,.45); }
  #viewer .audio-big.playing .ring { box-shadow: 0 0 0 14px rgba(124,192,255,.15), 0 24px 70px rgba(0,0,0,.45); }
  body.cam-open #toast { bottom: auto; top: calc(env(safe-area-inset-top) + 64px); }

  /* Grand écran : menu toujours visible */
  @media (min-width: 900px) {
    #drawer { transform: none; }
    #backdrop, #menuBtn { display: none; }
    body { padding-left: 330px; }
    #actions { left: calc(50% + 165px); }
  }
</style>
</head>
<body>
<header class="top">
  <button class="icon" id="menuBtn" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
  <h1 id="title">Mes voyages</h1>
  <button class="icon" id="delTrip" aria-label="Supprimer le voyage" hidden><i class="fa-solid fa-trash-can"></i></button>
</header>

<nav id="drawer">
  <h2><i class="fa-solid fa-suitcase-rolling"></i> Mes voyages</h2>
  <form id="new"><input name="name" placeholder="Nouveau voyage" required><button aria-label="Créer"><i class="fa-solid fa-plus"></i></button></form>
  <ul id="tripList"></ul>
</nav>
<div id="backdrop"></div>

<main id="main"></main>

<footer id="actions" hidden>
  <button id="camBtn"><i class="fa-solid fa-camera"></i>Caméra</button>
  <button id="rec"><i class="fa-solid fa-microphone"></i><b>Audio</b></button>
</footer>
<div id="toast" hidden></div>

<div id="viewer" hidden>
  <div id="viewerTrack"></div>
  <div class="viewer-top">
    <button id="viewerClose" class="cam-glass" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button>
    <span id="viewerCount" class="cam-glass"></span>
    <span class="spacer"></span>
  </div>
  <button id="viewerPrev" class="viewer-nav cam-glass" aria-label="Précédent"><i class="fa-solid fa-chevron-left"></i></button>
  <button id="viewerNext" class="viewer-nav cam-glass" aria-label="Suivant"><i class="fa-solid fa-chevron-right"></i></button>
</div>

<div id="cam" hidden>
  <div class="cam-top">
    <div>
      <button id="camClose" class="cam-glass" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button>
      <button id="camFlash" class="cam-glass" data-flash="off" hidden><i class="fa-solid fa-bolt"></i></button>
    </div>
    <span id="camTimer" class="cam-glass">00:00:00</span>
    <div><button id="camRec" class="cam-glass" aria-label="Enregistrer un audio"><i class="fa-solid fa-microphone"></i></button></div>
  </div>
  <div class="cam-view"><video id="camView" autoplay playsinline muted></video></div>
  <div class="cam-bottom">
    <div class="lenses" id="lenses" hidden></div>
    <div class="modes" id="modes"><button data-mode="video">VIDÉO</button><button data-mode="photo">PHOTO</button></div>
    <div class="cam-row cam-glass">
      <label id="camImport" aria-label="Importer depuis la galerie"><i class="fa-solid fa-images"></i><input type="file" multiple accept="image/*,video/*,audio/*,text/plain"></label>
      <button id="shutter" aria-label="Déclencher"></button>
      <button id="camFlip" class="cam-glass" aria-label="Changer de caméra"><i class="fa-solid fa-camera-rotate"></i></button>
    </div>
  </div>
</div>

<script type="module">
import { uploadPresigned } from 'https://esm.sh/@vercel/blob@2.8.0/client';

const $ = s => document.querySelector(s);
const main = $('#main'), toast = $('#toast');
const esc = s => s.replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
const currentTrip = () => decodeURIComponent(location.hash.slice(1));

async function api(q = '', opts = {}) {
  const r = await fetch('/api/trips' + q, { ...opts, headers: { 'content-type': 'application/json' } });
  const json = await r.json();
  if (!r.ok) { alert(json.error || 'Erreur'); throw new Error(json.error); }
  return json;
}

// Menu
// Accolades volontaires : un onclick qui renvoie false annule le clic (le lien ne s'ouvrait plus).
const setMenu = open => { document.body.classList.toggle('menu-open', open); };
$('#menuBtn').onclick = () => setMenu(true);
$('#backdrop').onclick = () => setMenu(false);

async function loadTrips() {
  const trips = await api();
  const cur = currentTrip();
  $('#tripList').innerHTML = trips.length
    ? trips.map(t => `<li><a href="#${encodeURIComponent(t)}" class="${t === cur ? 'active' : ''}"><i class="fa-solid ${t === cur ? 'fa-folder-open' : 'fa-folder'}"></i> ${esc(t)}</a></li>`).join('')
    : '<li class="empty-list">Aucun voyage pour l’instant.</li>';
}
$('#tripList').onclick = e => {
  const a = e.target.closest('a');
  if (!a) return;
  e.preventDefault();
  setMenu(false);
  if (location.hash === a.hash) route(); else location.hash = a.hash;
};

$('#new').onsubmit = async e => {
  e.preventDefault();
  const name = e.target.name.value.trim();
  await api('', { method: 'POST', body: JSON.stringify({ name }) });
  e.target.reset();
  setMenu(false);
  location.hash = encodeURIComponent(name);
};

// Localisation : position actuelle (gardée 2 min) pour ce qu'on capture ; null si refusée ou indisponible
let lastPos = null;
function here() {
  if (lastPos && Date.now() - lastPos.t < 120000) return Promise.resolve(lastPos);
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res(lastPos = { lat: p.coords.latitude, lng: p.coords.longitude, t: Date.now() }),
      () => res(null), { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
  });
}

// Coordonnées GPS des données EXIF d'une photo JPEG importée (null si absentes)
async function exifGps(file) {
  if (!/jpe?g/i.test(file.type)) return null;
  const v = new DataView(await file.slice(0, 256 * 1024).arrayBuffer());
  if (v.byteLength < 4 || v.getUint16(0) !== 0xFFD8) return null;
  for (let o = 2; o + 10 < v.byteLength && v.getUint8(o) === 0xFF; o += 2 + v.getUint16(o + 2)) {
    if (v.getUint16(o) !== 0xFFE1 || v.getUint32(o + 4) !== 0x45786966) continue; // segment APP1 « Exif »
    const t = o + 10, le = v.getUint16(t) === 0x4949;
    const u16 = p => v.getUint16(t + p, le), u32 = p => v.getUint32(t + p, le);
    const entry = (ifd, id) => { for (let i = 0, n = u16(ifd); i < n; i++) if (u16(ifd + 2 + i * 12) === id) return ifd + 2 + i * 12; return null; };
    const gpsPtr = entry(u32(4), 0x8825);
    if (gpsPtr === null) return null;
    const gps = u32(gpsPtr + 8);
    const coord = (valId, refId) => {
      const e = entry(gps, valId), r = entry(gps, refId);
      if (e === null || r === null) return NaN;
      const p = u32(e + 8), [d, m, s] = [0, 8, 16].map(k => u32(p + k) / u32(p + k + 4));
      return (d + m / 60 + s / 3600) * (/[SW]/.test(String.fromCharCode(v.getUint8(t + r + 8))) ? -1 : 1);
    };
    const lat = coord(2, 1), lng = coord(4, 3);
    return Number.isFinite(lat) && Number.isFinite(lng) ? { lat, lng } : null;
  }
  return null;
}

// Envoi des médias. live = pris dans l'appli (position actuelle) ; sinon position lue dans la photo importée.
// Les coordonnées vont dans le nom du fichier (« photo-…@45.12345,6.12345.jpg ») : pas besoin de base de données.
async function send(files, live) {
  const trip = currentTrip();
  try {
    for (const [i, f] of [...files].entries()) {
      toast.hidden = false;
      toast.textContent = `Envoi ${i + 1}/${files.length} : ${f.name}…`;
      const pos = live ? await here() : await exifGps(f).catch(() => null);
      const name = pos ? f.name.replace(/(\.\w+)?$/, `@${pos.lat.toFixed(5)},${pos.lng.toFixed(5)}$1`) : f.name;
      await uploadPresigned(`trips/${trip}/${name}`, f, { access: 'private', handleUploadUrl: '/api/upload' });
    }
  } catch (e) {
    alert('Échec de l’envoi : ' + e.message);
  }
  toast.hidden = true;
  if (currentTrip() === trip) loadItems(trip);
}
$('#camImport input').onchange = e => send(e.target.files).finally(() => e.target.value = '');

// Caméra intégrée, façon appareil photo iOS : glisser pour passer de PHOTO à VIDÉO
const cam = $('#cam'), camView = $('#camView'), camTimer = $('#camTimer'), modes = $('#modes'), lensesEl = $('#lenses'), flashBtn = $('#camFlash');
let camStream, camRec, camTick, camReq = 0, facing = 'environment', lensId = null;
const wait = ms => new Promise(r => setTimeout(r, ms));
const videoTrack = () => camStream?.getVideoTracks()[0];

async function startCam() {
  const req = ++camReq; // ignore les demandes dépassées (changement de mode rapide)
  camStream?.getTracks().forEach(t => t.stop());
  let stream;
  try {
    const which = lensId && facing === 'environment' ? { deviceId: { exact: lensId } } : { facingMode: facing };
    stream = await navigator.mediaDevices.getUserMedia({
      video: { ...which, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: cam.dataset.mode === 'video',
    });
  } catch (e) {
    alert('Impossible d’accéder à la caméra : ' + e.message);
    return closeCam();
  }
  if (req !== camReq || cam.hidden) return stream.getTracks().forEach(t => t.stop());
  camView.srcObject = camStream = stream;
  cam.classList.toggle('front', facing === 'user');
  await setupLenses();
  applyTorch();
}

// Objectifs : 1) zoom matériel si la caméra le propose (Chrome Android, Safari récent),
// 2) sinon bascule entre objectifs physiques repérés par leur nom (ultra grand-angle, téléobjectif),
// 3) sinon zoom numérique (photo uniquement : on recadre le centre de l'image).
let lens = { kind: 'none', stops: [], z: 1, min: 1, max: 1, devices: [] };

async function backLenses() {
  const all = (await navigator.mediaDevices.enumerateDevices())
    .filter(d => d.kind === 'videoinput' && !/front|avant|user|facetime/i.test(d.label));
  const out = [];
  for (const d of all) {
    // Les caméras « Dual » / « Triple » d'iOS sont virtuelles : on garde les objectifs réels
    const z = /ultra/i.test(d.label) ? 0.5 : /t[ée]l[ée]/i.test(d.label) ? 2 : /dual|triple|double/i.test(d.label) ? null : 1;
    if (z !== null && !out.some(o => o.z === z)) out.push({ z, id: d.deviceId });
  }
  return out.sort((a, b) => a.z - b.z);
}

async function setupLenses() {
  const track = videoTrack(), caps = track?.getCapabilities?.() || {};
  torchOK = !!caps.torch;
  let devs;
  if (caps.zoom && caps.zoom.max > caps.zoom.min) {
    const { min, max } = caps.zoom;
    const stops = [...new Set([min < 1 ? min : 1, 1, 2, 3, 5])].filter(v => v >= min && v <= max);
    lens = { kind: 'hw', stops, min, max, z: track.getSettings().zoom || 1 };
  } else if (facing === 'environment' && (devs = await backLenses()).length > 1) {
    const cur = devs.find(d => d.id === track.getSettings().deviceId) || devs.find(d => d.z === 1) || devs[0];
    lens = { kind: 'dev', stops: devs.map(d => d.z), devices: devs, z: cur.z };
  } else if (cam.dataset.mode === 'photo') {
    lens = { kind: 'digital', stops: [1, 2, 3], min: 1, max: 5, z: 1 };
  } else {
    lens = { kind: 'none', stops: [], z: 1 };
  }
  applyZoomView();
  renderLenses();
  renderFlash();
}

function setZoom(z, done) {
  if (lens.kind === 'dev') {
    // Objectifs physiques : on affiche le plus proche, et on change de caméra au lâcher
    const d = lens.devices.reduce((a, b) => Math.abs(b.z - z) < Math.abs(a.z - z) ? b : a);
    lens.z = d.z;
    renderLenses();
    if (done && !camRec && d.id !== videoTrack()?.getSettings().deviceId) { lensId = d.id; startCam(); }
    return;
  }
  lens.z = Math.min(lens.max, Math.max(lens.min, z));
  renderLenses();
  if (lens.kind === 'hw') videoTrack()?.applyConstraints({ advanced: [{ zoom: lens.z }] }).catch(() => {});
  applyZoomView();
}

function applyZoomView() {
  const z = lens.kind === 'digital' ? lens.z : 1;
  camView.style.transform = `scale(${facing === 'user' ? -z : z}, ${z})`; // miroir pour la caméra avant
}

const fmtZ = z => String(Math.round(z * 10) / 10).replace('.', ',');
let lensActive = null;
function renderLenses() {
  lensesEl.hidden = !lens.stops.length;
  lensesEl.classList.toggle('devices', lens.kind === 'dev');
  // On ne reconstruit les boutons que si la liste d'objectifs change (sinon la goutte perdrait son animation)
  const key = lens.stops.join();
  if (lensesEl.dataset.key !== key) {
    lensesEl.dataset.key = key;
    lensesEl.innerHTML = '<span class="lens-blob"></span>' + lens.stops.map(s => `<button data-z="${s}"></button>`).join('');
    lensActive = null;
  }
  const active = lens.stops.reduce((a, s) => lens.z >= s - 0.05 ? s : a, lens.stops[0]);
  lensesEl.querySelectorAll('button').forEach(b => {
    const s = +b.dataset.z, on = s === active;
    b.classList.toggle('on', on);
    b.textContent = on ? fmtZ(lens.z) + '×' : fmtZ(s);
  });
  placeBlob(active);
}

// La goutte de verre glisse vers le nouvel objectif en s'étirant, puis rebondit en place
function placeBlob(active) {
  const blob = lensesEl.querySelector('.lens-blob'), b = lensesEl.querySelector(`[data-z="${active}"]`);
  if (!blob || !b) return;
  const to = b.offsetLeft, from = parseFloat(blob.dataset.x ?? to);
  blob.dataset.x = to;
  blob.style.width = b.offsetWidth + 'px';
  blob.style.transform = `translateX(${to}px)`;
  const changed = lensActive !== null && active !== lensActive;
  lensActive = active;
  if (!changed) return;
  blob.animate([
    { transform: `translateX(${from}px) scale(1)` },
    { transform: `translateX(${(from + to) / 2}px) scale(1.4, .78)`, offset: .45 },
    { transform: `translateX(${to}px) scale(.9, 1.1)`, offset: .78 },
    { transform: `translateX(${to}px) scale(1)` },
  ], { duration: 420, easing: 'cubic-bezier(.3,.7,.4,1)' });
  b.animate([{ transform: 'scale(.6)' }, { transform: 'scale(1.18)', offset: .6 }, { transform: 'scale(1)' }], { duration: 320, easing: 'ease-out' });
}

// Toucher un objectif pour y aller, ou glisser sur la barre pour zoomer en continu (à gauche = zoomer, comme la molette d'iOS)
let lensDrag = null;
lensesEl.addEventListener('pointerdown', e => {
  lensDrag = { x: e.clientX, z0: lens.z, moved: false };
  lensesEl.setPointerCapture(e.pointerId);
});
lensesEl.addEventListener('pointermove', e => {
  if (!lensDrag) return;
  const dx = e.clientX - lensDrag.x;
  if (Math.abs(dx) > 6) lensDrag.moved = true;
  if (lensDrag.moved) setZoom(lensDrag.z0 * Math.exp(-dx / 90), false);
});
lensesEl.addEventListener('pointerup', e => {
  if (!lensDrag) return;
  const { moved } = lensDrag;
  lensDrag = null;
  if (moved) return setZoom(lens.z, true);
  const b = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-z]');
  if (b) setZoom(+b.dataset.z, true);
});
lensesEl.addEventListener('pointercancel', () => { lensDrag = null; });
// Glisser sur les objectifs ne doit pas faire passer de PHOTO à VIDÉO
['touchstart', 'touchend'].forEach(t => lensesEl.addEventListener(t, e => e.stopPropagation()));

// Flash : désactivé / auto / activé en photo, désactivé / activé (lampe continue) en vidéo.
// Caméra arrière : vraie lampe si le navigateur y a accès. Caméra avant : écran blanc (« flash Retina »).
let flashMode = 'off', torchOK = false;
const FLASH_CYCLE = { photo: ['off', 'auto', 'on'], video: ['off', 'on'] };
function renderFlash() {
  const mode = cam.dataset.mode;
  if (mode === 'video' && flashMode === 'auto') flashMode = 'off';
  flashBtn.hidden = !(torchOK || (mode === 'photo' && facing === 'user'));
  flashBtn.dataset.flash = flashMode;
  flashBtn.setAttribute('aria-label', 'Flash : ' + { off: 'désactivé', auto: 'automatique', on: 'activé' }[flashMode]);
}
function applyTorch(on = cam.dataset.mode === 'video' && flashMode === 'on') {
  if (torchOK) videoTrack()?.applyConstraints({ advanced: [{ torch: on }] }).catch(() => {});
}
flashBtn.onclick = () => {
  const cycle = FLASH_CYCLE[cam.dataset.mode];
  flashMode = cycle[(cycle.indexOf(flashMode) + 1) % cycle.length];
  renderFlash();
  applyTorch();
};

// Mode auto : on mesure la luminosité moyenne de l'aperçu
function isDark() {
  const c = document.createElement('canvas');
  c.width = c.height = 16;
  const g = c.getContext('2d');
  g.drawImage(camView, 0, 0, 16, 16);
  const d = g.getImageData(0, 0, 16, 16).data;
  let sum = 0;
  for (let i = 0; i < d.length; i += 4) sum += d[i] * .3 + d[i + 1] * .59 + d[i + 2] * .11;
  return sum / 256 < 70;
}

function setMode(mode) {
  if (camRec || mode === cam.dataset.mode) return;
  cam.dataset.mode = mode;
  modes.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  centerMode();
  startCam();
}

// Centre le mode actif sous l'aperçu, comme le sélecteur d'iOS
function centerMode() {
  const on = modes.querySelector('.on');
  if (on) modes.style.transform = `translateX(${modes.offsetWidth / 2 - on.offsetLeft - on.offsetWidth / 2}px)`;
}
addEventListener('resize', centerMode);

function openCam() {
  here(); // demande la position dès l'ouverture, pour qu'elle soit prête au déclenchement
  cam.hidden = false;
  document.body.classList.add('cam-open');
  cam.dataset.mode = '';
  setMode('photo');
}

function closeCam() {
  camRec?.stop(); // une vidéo en cours est enregistrée, pas perdue
  camReq++;
  camStream?.getTracks().forEach(t => t.stop());
  camStream = null;
  camView.srcObject = null;
  cam.hidden = true;
  cam.classList.remove('screen-flash');
  document.body.classList.remove('cam-open');
}

async function takePhoto() {
  const vw = camView.videoWidth, vh = camView.videoHeight;
  if (!vw) return;
  const fire = flashMode === 'on' || (flashMode === 'auto' && isDark());
  if (fire) {
    if (torchOK && facing === 'environment') { applyTorch(true); await wait(500); } // laisse l'exposition s'adapter à la lumière
    else { cam.classList.add('screen-flash'); await wait(300); }
  }
  const z = lens.kind === 'digital' ? lens.z : 1;
  const c = document.createElement('canvas');
  c.width = vw;
  c.height = vh;
  c.getContext('2d').drawImage(camView, (vw - vw / z) / 2, (vh - vh / z) / 2, vw / z, vh / z, 0, 0, vw, vh);
  if (fire) { applyTorch(false); cam.classList.remove('screen-flash'); }
  cam.classList.add('flash');
  setTimeout(() => cam.classList.remove('flash'), 120);
  c.toBlob(b => {
    // Miniature de la dernière photo, comme sur iOS
    $('#camImport').style.backgroundImage = `url(${URL.createObjectURL(b)})`;
    $('#camImport').classList.add('thumb');
    send([new File([b], `photo-${Date.now()}.jpg`, { type: 'image/jpeg' })], true);
  }, 'image/jpeg', 0.9);
}

const hms = s => [s / 3600, s / 60 % 60, s % 60].map(n => String(Math.floor(n)).padStart(2, '0')).join(':');

// Enregistre un flux jusqu'à stop(), puis envoie le fichier (vidéo et audio)
function record(stream, prefix, extOf, onStop) {
  const r = new MediaRecorder(stream), chunks = [];
  r.ondataavailable = e => chunks.push(e.data);
  r.onstop = () => {
    const type = (r.mimeType || (stream.getVideoTracks().length ? 'video/webm' : 'audio/webm')).split(';')[0];
    onStop();
    send([new File(chunks, `${prefix}-${Date.now()}.${extOf(type)}`, { type })], true);
  };
  r.start();
  return r;
}

function toggleVideo() {
  if (camRec) return camRec.stop();
  if (!camStream) return;
  const start = Date.now();
  camRec = record(camStream, 'video', t => t.includes('mp4') ? 'mp4' : 'webm', () => {
    camRec = null;
    clearInterval(camTick);
    camTimer.textContent = hms(0);
    cam.classList.remove('rec');
  });
  cam.classList.add('rec');
  camTick = setInterval(() => { camTimer.textContent = hms((Date.now() - start) / 1000); }, 500);
}

// Glisser à droite -> VIDÉO, à gauche -> PHOTO
let touchX = null;
// Un deuxième doigt annule le glissement (c'est un pincement)

// Pincer l'aperçu pour zoomer : même zoom que la barre d'objectifs

camViewBox.addEventListener('touchstart', e => {

}, { passive: true });
camViewBox.addEventListener('touchmove', e => {
  if (camPinch && e.touches.length === 2) setZoom(camPinch.z0 * dist(...e.touches) / camPinch.d0, false);
}, { passive: true });
camViewBox.addEventListener('touchend', e => {
  if (camPinch && e.touches.length < 2) { camPinch = null; setZoom(lens.z, true); }
});
cam.addEventListener('gesturestart', e => e.preventDefault()); // empêche Safari de zoomer toute la page

// Carte : un point par lieu (médias à moins de ~100 m regroupés), avec la miniature d'une photo et le nombre de médias.
// Toucher un point ouvre ces médias dans la visionneuse.
// Carte vectorielle MapLibre + styles OpenFreeMap (gratuits, sans clé). La bibliothèque (~1 Mo) n'est chargée qu'à la première ouverture.
let tripMedia = [], map, pins = [], mapLib;
const PIN_ICON = { vid: 'fa-video', aud: 'fa-microphone', note: 'fa-quote-left' };
const loadMapLib = () => mapLib ??= new Promise((res, rej) => {
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js';
  s.onload = () => res(window.maplibregl);
  s.onerror = () => { mapLib = null; rej(new Error('Carte indisponible')); };
  document.head.append(s);
});

async function showMap() {
  const box = $('#map');
  if (!box || $('#mapTab').hidden) return;
  const ml = await loadMapLib();
  if (!box.isConnected || $('#mapTab').hidden) return;
  if (!map || map.getContainer() !== box) {
    map?.remove();
    const dark = matchMedia('(prefers-color-scheme: dark)').matches;
    map = new ml.Map({
      container: box, style: `https://tiles.openfreemap.org/styles/${dark ? 'dark' : 'liberty'}`,
      center: [2.4, 46.6], zoom: 4.5, pitch: 55, maxPitch: 80,
      attributionControl: { compact: true }, // mention des sources repliée dans un petit ⓘ
    });
    map.addControl(new ml.NavigationControl({ showZoom: false, visualizePitch: true }), 'top-right'); // boussole : retour au nord / à plat
    map.on('zoomend', drawPins);
    map.on('click', closeSheet);
    map.once('load', () => {
      // Le ⓘ s'affiche déplié au chargement : on le replie
      box.querySelector('.maplibregl-ctrl-attrib')?.classList.remove('maplibregl-compact-show');
      // Relief 3D : altitudes libres d'AWS (Terrarium), ombrage des montagnes et ciel à l'horizon
      const dem = { type: 'raster-dem', tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
        encoding: 'terrarium', tileSize: 256, maxzoom: 15, attribution: 'Relief © Mapzen / AWS Terrain Tiles' };
      map.addSource('dem', dem);
      map.addSource('dem-shade', { ...dem, attribution: undefined });
      map.setTerrain({ source: 'dem', exaggeration: 1.4 });
      const firstLabel = map.getStyle().layers.find(l => l.type === 'symbol')?.id;
      map.addLayer({ id: 'relief', type: 'hillshade', source: 'dem-shade',
        paint: { 'hillshade-exaggeration': .45, 'hillshade-shadow-color': dark ? '#000' : '#5c4f42', 'hillshade-highlight-color': dark ? '#444' : '#fff' } }, firstLabel);
      map.setSky?.({ 'sky-color': dark ? '#0b1020' : '#8ec5ff', 'horizon-color': dark ? '#1c2540' : '#e8f3ff', 'sky-horizon-blend': .6, 'horizon-fog-blend': .6 });
      drawPins();
    });
  }
  const located = tripMedia.filter(m => m.lat !== undefined);
  $('.map-empty').hidden = located.length > 0;
  map.resize();
  if (located.length) {
    const bounds = new ml.LngLatBounds();
    located.forEach(m => bounds.extend([m.lng, m.lat]));
    map.fitBounds(bounds, { padding: 70, maxZoom: 15, pitch: 55, duration: 0 });
  }
  closeSheet();
  drawPins();
}

// Regroupe les médias dont les points se chevaucheraient à l'écran (recalculé à chaque zoom, comme Plans)
function drawPins() {
  pins.forEach(p => p.remove());
  pins = [];
  const groups = [];
  for (const m of tripMedia) if (m.lat !== undefined) {
    const p = map.project([m.lng, m.lat]);
    const g = groups.find(g => Math.hypot(g.p.x - p.x, g.p.y - p.y) < 56);
    if (g) g.items.push(m); else groups.push({ p, items: [m] });
  }
  for (const { items } of groups) {
    // Plusieurs médias au même endroit : jusqu'à 3 cartes en éventail (photos devant), avec le nombre total
    const shown = [...items].sort((a, b) => (b.kind === 'img') - (a.kind === 'img')).slice(0, 3);
    const el = document.createElement('div');
    el.className = 'pin';
    // Carte de devant droite, les autres inclinées de part et d'autre
    el.innerHTML = shown.map((m, i) => `<span class="card" style="--i:${[0, -1, 1][i]}">${thumbHTML(m)}</span>`).reverse().join('')
      + (items.length > 1 ? `<b>${items.length}</b>` : '');
    el.onclick = e => { e.stopPropagation(); openSheet(items); };
    pins.push(new maplibregl.Marker({ element: el, anchor: 'bottom', offset: [0, -10] }).setLngLat([items[0].lng, items[0].lat]).addTo(map));
  }
}

const thumbHTML = m => m.kind === 'img' ? `<img src="${m.src}" alt="">`
  : m.kind === 'note' && m.text ? `<em>${esc(m.text.slice(0, 60))}</em>`
  : `<i class="fa-solid ${PIN_ICON[m.kind]}"></i>`;

// Aperçu du lieu : seulement les médias de ce point ; toucher l'un d'eux l'ouvre dans la visionneuse
function openSheet(items) {

  $('#sheetStrip').innerHTML = items.map((m, i) =>

  $('#sheetStrip').onclick = e => { const b = e.target.closest('[data-i]'); if (b) openViewer(items, +b.dataset.i); };
  $('#mapSheet').hidden = false;
}
function closeSheet() { const s = $('#mapSheet'); if (s) s.hidden = true; }
document.addEventListener('click', e => { if (e.target.closest('#sheetClose')) closeSheet(); });

// Aléatoire stable tiré du nom du fichier : la disposition reste la même à chaque ouverture
const rand = (s, salt) => { let h = 2166136261; for (const c of s + salt) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return (h >>> 0) / 4294967296; };
const fmt = s => Number.isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : '–:––';
const RING = 2 * Math.PI * 38;

// Lecteur rond (petit dans le voyage, grand dans la visionneuse : même code, taille changée en CSS)
const audioHTML = (src, date, extra) => `<button class="ring${extra}" aria-label="Lire l’audio du ${date}"><svg viewBox="0 0 84 84"><circle class="track" cx="42" cy="42" r="38"/><circle class="prog" cx="42" cy="42" r="38"/></svg><i class="fa-solid fa-play"></i></button>
  <span class="len">–:––</span><audio src="${src}" preload="metadata"></audio>`;

function wireAudio(el) {
  const a = el.querySelector('audio'), prog = el.querySelector('.prog'), icon = el.querySelector('.ring i'), len = el.querySelector('.len');
  const show = () => {
    const d = Number.isFinite(a.duration) && a.duration > 0 ? a.duration : 0;
    prog.style.strokeDashoffset = RING * (1 - (d ? a.currentTime / d : 0));
    len.textContent = fmt(a.paused && !a.currentTime ? a.duration : a.currentTime);
  };
  a.ontimeupdate = a.ondurationchange = show;
  // Les enregistrements WebM n'annoncent pas leur durée : on la force en sautant à la fin puis on revient au début
  a.onloadedmetadata = () => {
    if (a.duration !== Infinity) return show();
    a.ontimeupdate = () => { a.ontimeupdate = show; a.currentTime = 0; show(); };
    a.currentTime = 1e9;
  };
  a.onplay = () => {
    document.querySelectorAll('audio').forEach(o => { if (o !== a) o.pause(); });
    icon.className = 'fa-solid fa-pause';
    el.classList.add('playing');
  };
  a.onpause = () => { icon.className = 'fa-solid fa-play'; el.classList.remove('playing'); show(); };
  a.onended = () => { a.currentTime = 0; show(); };
  el.querySelector('.ring').onclick = () => { if (a.paused) a.play(); else a.pause(); };
}

// Visionneuse plein écran : défilement horizontal aimanté (glisser au doigt entre photos et vidéos)
const viewer = $('#viewer'), track = $('#viewerTrack');
let viewerIdx = 0;

function openViewer(media, i) {
  track.innerHTML = media.map(m => `<div class="slide">${
    m.kind === 'img' ? `<img src="${m.src}" loading="lazy" alt="">`
    : m.kind === 'vid' ? `<video src="${m.src}" controls playsinline preload="metadata"></video>`
    : m.kind === 'aud' ? `<div class="audio-big">${audioHTML(m.src, m.date, ' cam-glass')}<time>${m.date}</time></div>`
    : `<div class="note-big cam-glass"><i class="fa-solid fa-quote-left"></i><pre>${esc(m.text)}</pre><time>${m.date}</time></div>`}</div>`).join('');
  track.querySelectorAll('.audio-big').forEach(wireAudio);
  viewer.hidden = false;
  document.body.classList.add('viewer-open');
  track.scrollLeft = i * track.clientWidth;
  viewerIdx = -1;
  onViewerScroll();
}

function closeViewer() {
  resetZoom();
  viewer.hidden = true;
  track.innerHTML = ''; // arrête les vidéos et les chargements
  viewer.style.removeProperty('--fade');
  viewer.classList.remove('dragging');
  document.body.classList.remove('viewer-open');
}

// Gestes de la visionneuse, comme dans Photos d'iOS :
// pincer pour zoomer, déplacer la photo zoomée, double-tap pour zoomer/dézoomer,
// glisser vers le haut ou le bas pour fermer.
let zoom = { s: 1, x: 0, y: 0, img: null }, pinch = null, pan = null, drag = null, lastTap = 0;
const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
const mid = (a, b) => ({ x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 });

function applyZoom(animate) {
  track.style.overflowX = zoom.s > 1 ? 'hidden' : ''; // bloque le passage à la photo suivante pendant le zoom
  const img = zoom.img;
  if (!img) return;
  img.style.transition = animate ? 'transform .25s ease' : '';
  img.style.transform = zoom.s > 1 ? `translate(${zoom.x}px, ${zoom.y}px) scale(${zoom.s})` : '';
}
function resetZoom(animate) {
  zoom.s = 1; zoom.x = zoom.y = 0;
  applyZoom(animate);
  zoom.img = null;
}
// Centre de l'image sans le déplacement du zoom (le zoom se fait autour de ce centre)
const baseCenter = img => { const r = img.getBoundingClientRect(); return { x: r.left + r.width / 2 - zoom.x, y: r.top + r.height / 2 - zoom.y }; };

viewer.addEventListener('gesturestart', e => e.preventDefault()); // empêche Safari de zoomer toute la page

viewer.addEventListener('touchstart', e => {
  const img = e.target.closest('.slide img');
  if (e.touches.length === 2 && img) {
    drag = pan = null;
    if (zoom.img !== img) { resetZoom(); zoom.img = img; }
    const m = mid(e.touches[0], e.touches[1]), c = baseCenter(img);
    pinch = { d0: dist(e.touches[0], e.touches[1]), s0: zoom.s, x0: zoom.x, y0: zoom.y, m0: { x: m.x - c.x, y: m.y - c.y }, c };
    return;
  }
  if (e.touches.length !== 1) return;
  const t = e.touches[0];
  if (zoom.s > 1) { pan = { x: t.clientX, y: t.clientY, x0: zoom.x, y0: zoom.y }; return; }
  drag = { x: t.clientX, y: t.clientY, t: Date.now(), on: false, note: e.target.closest('.note-big') };
}, { passive: true });

viewer.addEventListener('touchmove', e => {
  if (pinch && e.touches.length === 2) {
    e.preventDefault();
    const s = Math.min(5, Math.max(1, pinch.s0 * dist(e.touches[0], e.touches[1]) / pinch.d0));
    const m = mid(e.touches[0], e.touches[1]);
    // Garde sous les doigts le point de la photo qu'on pince
    zoom.s = s;
    zoom.x = (m.x - pinch.c.x) - (pinch.m0.x - pinch.x0) / pinch.s0 * s;
    zoom.y = (m.y - pinch.c.y) - (pinch.m0.y - pinch.y0) / pinch.s0 * s;
    return applyZoom();
  }
  if (pan) {
    e.preventDefault();
    zoom.x = pan.x0 + e.touches[0].clientX - pan.x;
    zoom.y = pan.y0 + e.touches[0].clientY - pan.y;
    return applyZoom();
  }
  if (!drag) return;
  const dx = e.touches[0].clientX - drag.x, dy = e.touches[0].clientY - drag.y;
  if (!drag.on) {
    if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) { drag = null; return; } // glissement horizontal : on laisse défiler
    if (Math.abs(dy) < 10) return;
    // Dans une longue note, on laisse d'abord défiler le texte
    const n = drag.note;
    if (n && (dy > 0 ? n.scrollTop > 0 : n.scrollTop + n.clientHeight < n.scrollHeight - 1)) { drag = null; return; }
    drag.on = true;
    drag.slide = track.children[viewerIdx];
    viewer.classList.add('dragging');
  }
  e.preventDefault();
  drag.dy = dy;
  drag.slide.style.transform = `translate(${dx * .3}px, ${dy}px) scale(${1 - Math.min(Math.abs(dy) / 1500, .25)})`;
  viewer.style.setProperty('--fade', 1 - Math.min(Math.abs(dy) / 400, .8));
}, { passive: false });

function onTouchEnd(e) {
  if (pinch && e.touches.length < 2) {
    pinch = null;
    if (zoom.s < 1.05) resetZoom(true);
    return;
  }
  if (pan && !e.touches.length) pan = null;
  // Double-tap sur une photo : zoom x2,5 à l'endroit touché, ou retour à la normale
  const img = e.target.closest?.('.slide img');
  if (img && e.changedTouches.length === 1 && !drag?.on && !e.touches.length) {
    const now = Date.now();
    if (now - lastTap < 300) {
      lastTap = 0;
      if (zoom.s > 1) resetZoom(true);
      else {
        zoom.img = img;
        const c = baseCenter(img), t = e.changedTouches[0];
        zoom.s = 2.5; zoom.x = -(t.clientX - c.x) * 1.5; zoom.y = -(t.clientY - c.y) * 1.5;
        applyZoom(true);
      }
      drag = null;
      return;
    }
    lastTap = now;
  }
  if (!drag?.on) { drag = null; return; }
  const { slide, dy, t } = drag;
  drag = null;
  slide.style.transition = 'transform .25s ease';
  viewer.style.transition = '--fade .25s';
  if (Math.abs(dy) > 120 || Math.abs(dy) / (Date.now() - t) > .6) {
    slide.style.transform = `translateY(${Math.sign(dy) * innerHeight}px)`;
    viewer.style.setProperty('--fade', 0);
    setTimeout(closeViewer, 250);
  } else {
    slide.style.transform = '';
    viewer.style.removeProperty('--fade');
  }
  setTimeout(() => { slide.style.transition = viewer.style.transition = ''; viewer.classList.remove('dragging'); }, 260);
}
viewer.addEventListener('touchend', onTouchEnd);
viewer.addEventListener('touchcancel', onTouchEnd);

function onViewerScroll() {
  const i = Math.round(track.scrollLeft / track.clientWidth);
  if (i === viewerIdx) return;
  viewerIdx = i;
  resetZoom();
  $('#viewerCount').textContent = `${i + 1} / ${track.children.length}`;
  track.querySelectorAll('video, audio').forEach(v => v.pause()); // on coupe la vidéo ou l'audio qu'on vient de quitter
}
const viewerGo = step => track.scrollBy({ left: step * track.clientWidth, behavior: 'smooth' });

track.onscroll = onViewerScroll;
$('#viewerClose').onclick = closeViewer;
$('#viewerPrev').onclick = () => viewerGo(-1);
$('#viewerNext').onclick = () => viewerGo(1);
addEventListener('keydown', e => {
  if (e.key === 'Escape' && !cam.hidden) return closeCam();
  if (viewer.hidden) return;
  if (e.key === 'Escape') closeViewer();
  if (e.key === 'ArrowLeft') viewerGo(-1);
  if (e.key === 'ArrowRight') viewerGo(1);
});

async function loadItems(trip) {
  const blobs = (await api(`?trip=${encodeURIComponent(trip)}`))
    .sort((a, b) => b.uploadedAt.localeCompare(a.uploadedAt));
  const box = $('#items');
  if (!box || currentTrip() !== trip) return;
  box.innerHTML = blobs.length ? '' : '<p class="empty">Ce voyage est vide.<br>Ajoutez une photo, une vidéo, un audio ou une note.</p>';
  const media = []; // photos et vidéos, dans l'ordre d'affichage, pour la visionneuse
  for (const b of blobs) {
    const ext = b.pathname.split('.').pop().toLowerCase();
    const date = new Date(b.uploadedAt).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' });
    const el = document.createElement('div');
    el.className = 'item';
    const r = k => rand(b.pathname, k);
    const drift = `--d:${(5 + r('d') * 4).toFixed(1)}s;--delay:-${(r('l') * 6).toFixed(1)}s;`;
    const scatter = `--span:${r('s') < .3 ? 4 : 3};--r:${(r('r') * 10 - 5).toFixed(1)}deg;--dx:${Math.round(r('x') * 12 - 6)}px;--dy:${Math.round(r('y') * 18)}px;`;
    const isImg = /^(jpe?g|png|gif|webp|avif|heic)$/.test(ext), isVid = /^(mp4|mov|webm|m4v)$/.test(ext);
    const geo = decodeURIComponent(b.pathname).match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
    const where = geo ? { lat: +geo[1], lng: +geo[2] } : {}; // position pour la carte
    if (isImg || isVid) {
      // Disposition « en vrac » : taille, format, inclinaison et décalage tirés au hasard (mais stables)
      el.classList.add('float');
      el.style.cssText = drift + scatter + `--ar:${['1', '4/5', '3/4', '5/4'][Math.floor(r('a') * 4)]}`;
      el.innerHTML = isImg
        ? `<img src="${b.src}" loading="lazy" alt="">`
        : `<video src="${b.src}#t=0.1" muted playsinline preload="metadata"></video><span class="play-badge"><i class="fa-solid fa-play"></i></span>`;
      const i = media.push({ kind: isImg ? 'img' : 'vid', src: b.src, ...where }) - 1;
      el.querySelector('img, video').onclick = () => openViewer(media, i);
    } else if (ext === 'txt') {
      // Note : même disposition en vrac que les photos, et s'ouvre aussi dans la visionneuse
      el.classList.add('float', 'note');
      el.style.cssText = drift + scatter;
      el.innerHTML = `<i class="fa-solid fa-quote-left"></i><pre></pre><time>${date}</time>`;
      const m = { kind: 'note', text: '', date, src: b.src, ...where };
      const i = media.push(m) - 1;
      fetch(b.src).then(r => r.text()).then(t => { m.text = el.querySelector('pre').textContent = t; });
      el.querySelector('pre').onclick = () => openViewer(media, i);
    } else if (/^(weba|m4a|mp3|wav|ogg|aac|opus)$/.test(ext)) {
      el.classList.add('audio');
      el.style.cssText = drift;
      el.title = date;
      el.innerHTML = audioHTML(b.src, date, '');
      wireAudio(el);
      // Le rond lit l'audio sur place ; toucher la durée l'ouvre dans la visionneuse
      const i = media.push({ kind: 'aud', src: b.src, date, ...where }) - 1;
      el.querySelector('.len').onclick = () => openViewer(media, i);
    } else {
      el.classList.add('wide');
      el.innerHTML = `<a href="${b.src}" target="_blank">${esc(b.pathname.split('/').pop())}</a>`;
    }
    const del = document.createElement('button');
    del.className = 'del'; del.innerHTML = '<i class="fa-solid fa-xmark"></i>'; del.setAttribute('aria-label', 'Supprimer');
    del.onclick = async () => {
      if (!confirm('Supprimer ce média ?')) return;
      await api(`?url=${encodeURIComponent(b.url)}`, { method: 'DELETE' });
      el.remove();
      tripMedia = tripMedia.filter(m => m.src !== b.src); // retire aussi le point de la carte
    };
    el.append(del);
    box.append(el);
  }
  tripMedia = media;
  showMap();
}

// Verre interactif sur les boutons en verre (grossit, s'illumine sous le doigt, rebondit au lâcher)
const GLASS_BTNS = '.top .icon, #actions > button, button.cam-glass:not(.viewer-nav), #new button, #note button, .item.audio .ring';
addEventListener('pointerdown', e => {
  const b = e.target.closest(GLASS_BTNS);
  if (!b) return;
  const r = b.getBoundingClientRect();
  b.style.setProperty('--px', `${e.clientX - r.left}px`);
  b.style.setProperty('--py', `${e.clientY - r.top}px`);
  b.classList.add('pressed');
  const up = () => {
    removeEventListener('pointerup', up);
    removeEventListener('pointercancel', up);
    b.classList.remove('pressed');
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches)
      b.animate([{ transform: 'scale(1.08)' }, { transform: 'scale(.96)', offset: .5 }, { transform: 'scale(1)' }], { duration: 380, easing: 'cubic-bezier(.3,.7,.4,1)' });
  };
  addEventListener('pointerup', up);
  addEventListener('pointercancel', up);
});

// Barre du bas : se réduit quand on descend, revient quand on remonte (ou près du haut)
let lastScrollY = 0;
addEventListener('scroll', () => {
  const y = scrollY;
  if (Math.abs(y - lastScrollY) < 8) return;
  document.body.classList.toggle('bar-min', y > lastScrollY && y > 80);
  lastScrollY = y;
}, { passive: true });

function route() {
  const trip = currentTrip();
  document.body.classList.remove('bar-min');
  $('#title').textContent = trip || 'Mes voyages';
  $('#delTrip').hidden = $('#actions').hidden = !trip;
  loadTrips();
  setMenu(!trip);
  if (trip) return showTrip(trip);
  main.innerHTML = '<div class="welcome"><i class="fa-solid fa-suitcase-rolling"></i><p>Ouvrez le menu pour choisir ou créer un voyage.</p></div>';
}
addEventListener('hashchange', route);
route();
</script>
