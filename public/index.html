<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Mes voyages</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --text: #1a1d21; --muted: #6b7280; --line: #e5e7eb;
    --accent: #0f766e; --accent-soft: #e6f4f2; --danger: #dc2626;
    --top-h: 56px; --bar-h: 72px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1113; --card: #1a1d21; --text: #eceef1; --muted: #9aa1ab; --line: #2a2e34; --accent: #2dd4bf; --accent-soft: #123330; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }

  /* Barre du haut */
  .top { position: sticky; top: 0; z-index: 10; height: calc(var(--top-h) + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 8px 0;
    display: flex; align-items: center; gap: 4px; background: var(--card); border-bottom: 1px solid var(--line); }
  .top h1 { flex: 1; margin: 0; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon { width: 44px; height: 44px; border-radius: 12px; font-size: 22px; display: grid; place-items: center; }
  .icon:active { background: var(--line); }

  /* Menu latéral */
  #drawer { position: fixed; z-index: 30; inset: 0 auto 0 0; width: min(82vw, 320px); background: var(--card);
    transform: translateX(-100%); transition: transform .25s ease; display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 16px) 16px env(safe-area-inset-bottom); box-shadow: 4px 0 24px rgba(0,0,0,.15); }
  body.menu-open #drawer { transform: none; }
  #backdrop { position: fixed; z-index: 20; inset: 0; background: rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .25s; }
  body.menu-open #backdrop { opacity: 1; pointer-events: auto; }
  #drawer h2 { margin: 0 0 12px; font-size: 22px; }
  #new { display: flex; gap: 8px; margin-bottom: 12px; }
  #new input { flex: 1; min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
  #new button { padding: 0 16px; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 600; }
  #tripList { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  #tripList a { display: flex; font-size: 16px; align-items: center; gap: 10px; padding: 14px 12px; border-radius: 12px; text-decoration: none; color: inherit; }
  #tripList a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .empty-list { color: var(--muted); padding: 12px; }

  /* Contenu */
  main { padding: 12px 12px calc(var(--bar-h) + env(safe-area-inset-bottom) + 16px); max-width: 900px; margin: auto; }
  .welcome { text-align: center; color: var(--muted); margin-top: 20vh; padding: 0 24px; }
  .welcome i { font-size: 56px; color: var(--accent); }
  #note { display: flex; gap: 8px; align-items: flex-end; background: var(--card); border-radius: 16px; padding: 8px; margin-bottom: 12px; }
  #note textarea { flex: 1; border: 0; background: none; resize: none; min-height: 44px; max-height: 40vh; padding: 10px; outline: none; field-sizing: content; }
  #note button { height: 44px; padding: 0 14px; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  @media (min-width: 600px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .item { position: relative; background: var(--card); border-radius: 14px; overflow: hidden; }
  .item.wide { grid-column: 1 / -1; padding: 12px 44px 12px 12px; }
  .item img, .item video { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: #000; }
  .item audio { width: 100%; }
  .item pre { margin: 0; white-space: pre-wrap; font-family: inherit; }
  .item time { display: block; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .del { position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; font-size: 14px; }
  .empty { text-align: center; color: var(--muted); margin-top: 15vh; }

  /* Barre d'actions du bas */
  #actions { position: fixed; z-index: 10; inset: auto 0 0 0; display: flex; justify-content: space-around;
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--line); }
  #actions > * { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border-radius: 12px; font-size: 12px; color: var(--muted); cursor: pointer; }
  #actions i { font-size: 22px; height: 28px; display: grid; place-items: center; }
  #actions b { font-weight: inherit; }
  #actions > *:active { background: var(--line); }
  #rec.on { color: var(--danger); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .5; } }
  #toast { position: fixed; z-index: 60; left: 50%; bottom: calc(var(--bar-h) + env(safe-area-inset-bottom) + 12px); transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; max-width: 90vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  [hidden] { display: none !important; }

  /* Caméra intégrée, façon appareil photo iOS */
  #cam { position: fixed; z-index: 50; inset: 0; background: #000; color: #fff; display: flex; flex-direction: column;
    touch-action: none; user-select: none; -webkit-user-select: none; }
  .cam-top { height: calc(env(safe-area-inset-top) + 52px); padding: env(safe-area-inset-top) 8px 0; display: flex; align-items: center; justify-content: space-between; }
  .cam-top button, .cam-top span.spacer { width: 44px; height: 44px; color: #fff; font-size: 22px; }
  #camTimer { font-variant-numeric: tabular-nums; font-size: 17px; padding: 2px 8px; border-radius: 6px; }
  #cam[data-mode=photo] #camTimer { visibility: hidden; }
  #cam.rec #camTimer { background: #ff3b30; }
  .cam-view { flex: 1; position: relative; overflow: hidden; }
  #camView { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .1s; }
  #cam.front #camView { transform: scaleX(-1); }
  #cam.flash #camView { opacity: 0; }
  .cam-bottom { padding: 6px 0 calc(env(safe-area-inset-bottom) + 24px); }
  .modes { display: flex; gap: 28px; height: 40px; align-items: center; transition: transform .3s ease; }
  .modes button { color: #fff; font-size: 13px; font-weight: 600; letter-spacing: .1em; padding: 8px 0; }
  .modes button.on { color: #ffd60a; }
  #cam.rec .modes { visibility: hidden; }
  .cam-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 36px 0; }
  #camImport { width: 48px; height: 48px; border-radius: 10px; border: 2px solid rgba(255,255,255,.8); background: #222 center / cover;
    display: grid; place-items: center; font-size: 20px; cursor: pointer; }
  #camImport.thumb i { display: none; }
  #camImport input { display: none; }
  #camFlip { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,.18); color: #fff; font-size: 20px; }
  #cam.rec #camImport, #cam.rec #camFlip { visibility: hidden; }
  #shutter { width: 78px; height: 78px; border-radius: 50%; border: 4px solid #fff; padding: 4px; display: grid; place-items: center; }
  #shutter::after { content: ''; width: 100%; height: 100%; border-radius: 50%; background: #fff; transition: all .25s ease; }
  #shutter:active::after { transform: scale(.9); }
  #cam[data-mode=video] #shutter::after { background: #ff3b30; }
  #cam.rec #shutter::after { width: 42%; height: 42%; border-radius: 6px; }
  body.cam-open #toast { bottom: auto; top: calc(env(safe-area-inset-top) + 60px); }

  /* Grand écran : menu toujours visible */
  @media (min-width: 900px) {
    #drawer { transform: none; box-shadow: none; border-right: 1px solid var(--line); }
    #backdrop, #menuBtn { display: none; }
    body { padding-left: 320px; }
    #actions { left: 320px; }
  }
</style>
</head>
<body>
<header class="top">
  <button class="icon" id="menuBtn" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
  <h1 id="title">Mes voyages</h1>
  <button class="icon" id="delTrip" aria-label="Supprimer le voyage" hidden><i class="fa-solid fa-trash-can"></i></button>
</header>

<nav id="drawer">
  <h2><i class="fa-solid fa-suitcase-rolling"></i> Mes voyages</h2>
  <form id="new"><input name="name" placeholder="Nouveau voyage" required><button aria-label="Créer"><i class="fa-solid fa-plus"></i></button></form>
  <ul id="tripList"></ul>
</nav>
<div id="backdrop"></div>

<main id="main"></main>

<footer id="actions" hidden>
  <button id="camBtn"><i class="fa-solid fa-camera"></i>Caméra</button>
  <button id="rec"><i class="fa-solid fa-microphone"></i><b>Audio</b></button>
</footer>
<div id="toast" hidden></div>

<div id="cam" hidden>
  <div class="cam-top">
    <button id="camClose" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button>
    <span id="camTimer">00:00:00</span>
    <span class="spacer"></span>
  </div>
  <div class="cam-view"><video id="camView" autoplay playsinline muted></video></div>
  <div class="cam-bottom">
    <div class="modes" id="modes"><button data-mode="video">VIDÉO</button><button data-mode="photo">PHOTO</button></div>
    <div class="cam-row">
      <label id="camImport" aria-label="Importer depuis la galerie"><i class="fa-solid fa-images"></i><input type="file" multiple accept="image/*,video/*,audio/*,text/plain"></label>
      <button id="shutter" aria-label="Déclencher"></button>
      <button id="camFlip" aria-label="Changer de caméra"><i class="fa-solid fa-camera-rotate"></i></button>
    </div>
  </div>
</div>

<script type="module">
import { uploadPresigned } from 'https://esm.sh/@vercel/blob@2.8.0/client';

const $ = s => document.querySelector(s);
const main = $('#main'), toast = $('#toast');
const esc = s => s.replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
const currentTrip = () => decodeURIComponent(location.hash.slice(1));

async function api(q = '', opts = {}) {
  const r = await fetch('/api/trips' + q, { ...opts, headers: { 'content-type': 'application/json' } });
  const json = await r.json();
  if (!r.ok) { alert(json.error || 'Erreur'); throw new Error(json.error); }
  return json;
}

// Menu
// Accolades volontaires : un onclick qui renvoie false annule le clic (le lien ne s'ouvrait plus).
const setMenu = open => { document.body.classList.toggle('menu-open', open); };
$('#menuBtn').onclick = () => setMenu(true);
$('#backdrop').onclick = () => setMenu(false);

async function loadTrips() {
  const trips = await api();
  const cur = currentTrip();
  $('#tripList').innerHTML = trips.length
    ? trips.map(t => `<li><a href="#${encodeURIComponent(t)}" class="${t === cur ? 'active' : ''}"><i class="fa-solid ${t === cur ? 'fa-folder-open' : 'fa-folder'}"></i> ${esc(t)}</a></li>`).join('')
    : '<li class="empty-list">Aucun voyage pour l’instant.</li>';
}
$('#tripList').onclick = e => {
  const a = e.target.closest('a');
  if (!a) return;
  e.preventDefault();
  setMenu(false);
  if (location.hash === a.hash) route(); else location.hash = a.hash;
};

$('#new').onsubmit = async e => {
  e.preventDefault();
  const name = e.target.name.value.trim();
  await api('', { method: 'POST', body: JSON.stringify({ name }) });
  e.target.reset();
  setMenu(false);
  location.hash = encodeURIComponent(name);
};

// Envoi des médias
async function send(files) {
  const trip = currentTrip();
  try {
    for (const [i, f] of [...files].entries()) {
      toast.hidden = false;
      toast.textContent = `Envoi ${i + 1}/${files.length} : ${f.name}…`;
      await uploadPresigned(`trips/${trip}/${f.name}`, f, { access: 'private', handleUploadUrl: '/api/upload' });
    }
  } catch (e) {
    alert('Échec de l’envoi : ' + e.message);
  }
  toast.hidden = true;
  if (currentTrip() === trip) loadItems(trip);
}
$('#camImport input').onchange = e => send(e.target.files).finally(() => e.target.value = '');

// Caméra intégrée, façon appareil photo iOS : glisser pour passer de PHOTO à VIDÉO
const cam = $('#cam'), camView = $('#camView'), camTimer = $('#camTimer'), modes = $('#modes');
let camStream, camRec, camTick, camReq = 0, facing = 'environment';

async function startCam() {
  const req = ++camReq; // ignore les demandes dépassées (changement de mode rapide)
  camStream?.getTracks().forEach(t => t.stop());
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: cam.dataset.mode === 'video',
    });
  } catch (e) {
    alert('Impossible d’accéder à la caméra : ' + e.message);
    return closeCam();
  }
  if (req !== camReq || cam.hidden) return stream.getTracks().forEach(t => t.stop());
  camView.srcObject = camStream = stream;
  cam.classList.toggle('front', facing === 'user');
}

function setMode(mode) {
  if (camRec || mode === cam.dataset.mode) return;
  cam.dataset.mode = mode;
  modes.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  const on = modes.querySelector('.on');
  modes.style.transform = `translateX(${modes.offsetWidth / 2 - on.offsetLeft - on.offsetWidth / 2}px)`;
  startCam();
}

function openCam() {
  cam.hidden = false;
  document.body.classList.add('cam-open');
  cam.dataset.mode = '';
  setMode('photo');
}

function closeCam() {
  camRec?.stop(); // une vidéo en cours est enregistrée, pas perdue
  camReq++;
  camStream?.getTracks().forEach(t => t.stop());
  camStream = null;
  camView.srcObject = null;
  cam.hidden = true;
  document.body.classList.remove('cam-open');
}

function takePhoto() {
  const c = document.createElement('canvas');
  c.width = camView.videoWidth;
  c.height = camView.videoHeight;
  if (!c.width) return;
  c.getContext('2d').drawImage(camView, 0, 0);
  cam.classList.add('flash');
  setTimeout(() => cam.classList.remove('flash'), 120);
  c.toBlob(b => {
    // Miniature de la dernière photo, comme sur iOS
    $('#camImport').style.backgroundImage = `url(${URL.createObjectURL(b)})`;
    $('#camImport').classList.add('thumb');
    send([new File([b], `photo-${Date.now()}.jpg`, { type: 'image/jpeg' })]);
  }, 'image/jpeg', 0.9);
}

const hms = s => [s / 3600, s / 60 % 60, s % 60].map(n => String(Math.floor(n)).padStart(2, '0')).join(':');

function toggleVideo() {
  if (camRec) return camRec.stop();
  if (!camStream) return;
  const chunks = [], start = Date.now();
  camRec = new MediaRecorder(camStream);
  camRec.ondataavailable = e => chunks.push(e.data);
  camRec.onstop = () => {
    const type = (camRec.mimeType || 'video/webm').split(';')[0];
    camRec = null;
    clearInterval(camTick);
    camTimer.textContent = hms(0);
    cam.classList.remove('rec');
    send([new File(chunks, `video-${Date.now()}.${type.includes('mp4') ? 'mp4' : 'webm'}`, { type })]);
  };
  camRec.start();
  cam.classList.add('rec');
  camTick = setInterval(() => { camTimer.textContent = hms((Date.now() - start) / 1000); }, 500);
}

$('#camBtn').onclick = openCam;
$('#camClose').onclick = closeCam;
$('#camFlip').onclick = () => { if (camRec) return; facing = facing === 'user' ? 'environment' : 'user'; startCam(); };
$('#shutter').onclick = () => { cam.dataset.mode === 'photo' ? takePhoto() : toggleVideo(); };
modes.onclick = e => { if (e.target.dataset.mode) setMode(e.target.dataset.mode); };
// Glisser à droite -> VIDÉO, à gauche -> PHOTO
let touchX = null;
cam.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
cam.addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  touchX = null;
  if (Math.abs(dx) > 50) setMode(dx > 0 ? 'video' : 'photo');
});
addEventListener('keydown', e => e.key === 'Escape' && !cam.hidden && closeCam());

// Enregistrement audio
let rec;
const recBtn = $('#rec');
recBtn.onclick = async () => {
  if (rec) return rec.stop();
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  rec = new MediaRecorder(stream);
  const chunks = [];
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    const type = rec.mimeType.split(';')[0];
    const ext = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'weba';
    rec = null;
    recBtn.classList.remove('on'); recBtn.querySelector('b').textContent = 'Audio'; recBtn.querySelector('i').className = 'fa-solid fa-microphone';
    send([new File(chunks, `audio-${Date.now()}.${ext}`, { type })]);
  };
  rec.start();
  recBtn.classList.add('on'); recBtn.querySelector('b').textContent = 'Arrêter'; recBtn.querySelector('i').className = 'fa-solid fa-stop';
};

$('#delTrip').onclick = async () => {
  const trip = currentTrip();
  if (!confirm(`Supprimer « ${trip} » et tout son contenu ?`)) return;
  await api(`?trip=${encodeURIComponent(trip)}`, { method: 'DELETE' });
  location.hash = '';
};

// Affichage d'un voyage
function showTrip(trip) {
  main.innerHTML = `<form id="note"><textarea name="text" rows="1" placeholder="Écrire une note…"></textarea><button>Ajouter</button></form>
    <div class="grid" id="items"></div>`;
  $('#note').onsubmit = e => {
    e.preventDefault();
    const text = e.target.text.value.trim();
    if (!text) return;
    e.target.reset();
    send([new File([text], `note-${Date.now()}.txt`, { type: 'text/plain' })]);
  };
  loadItems(trip);
}

async function loadItems(trip) {
  const blobs = (await api(`?trip=${encodeURIComponent(trip)}`))
    .sort((a, b) => b.uploadedAt.localeCompare(a.uploadedAt));
  const box = $('#items');
  if (!box || currentTrip() !== trip) return;
  box.innerHTML = blobs.length ? '' : '<p class="empty" style="grid-column:1/-1">Ce voyage est vide.<br>Ajoutez une photo, une vidéo, un audio ou une note.</p>';
  for (const b of blobs) {
    const ext = b.pathname.split('.').pop().toLowerCase();
    const date = new Date(b.uploadedAt).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' });
    const el = document.createElement('div');
    el.className = 'item';
    if (/^(jpe?g|png|gif|webp|avif|heic)$/.test(ext)) el.innerHTML = `<a href="${b.src}" target="_blank"><img src="${b.src}" loading="lazy" alt=""></a>`;
    else if (/^(mp4|mov|webm|m4v)$/.test(ext)) el.innerHTML = `<video src="${b.src}#t=0.1" controls playsinline preload="metadata"></video>`;
    else {
      el.classList.add('wide');
      if (/^(weba|m4a|mp3|wav|ogg|aac|opus)$/.test(ext)) el.innerHTML = `<audio src="${b.src}" controls></audio><time>${date}</time>`;
      else if (ext === 'txt') { el.innerHTML = `<pre></pre><time>${date}</time>`; fetch(b.src).then(r => r.text()).then(t => el.firstChild.textContent = t); }
      else el.innerHTML = `<a href="${b.src}" target="_blank">${esc(b.pathname.split('/').pop())}</a>`;
    }
    const del = document.createElement('button');
    del.className = 'del'; del.innerHTML = '<i class="fa-solid fa-xmark"></i>'; del.setAttribute('aria-label', 'Supprimer');
    del.onclick = async () => {
      if (!confirm('Supprimer ce média ?')) return;
      await api(`?url=${encodeURIComponent(b.url)}`, { method: 'DELETE' });
      el.remove();
    };
    el.append(del);
    box.append(el);
  }
}

function route() {
  const trip = currentTrip();
  $('#title').textContent = trip || 'Mes voyages';
  $('#delTrip').hidden = $('#actions').hidden = !trip;
  loadTrips();
  setMenu(!trip);
  if (trip) return showTrip(trip);
  main.innerHTML = '<div class="welcome"><i class="fa-solid fa-suitcase-rolling"></i><p>Ouvrez le menu pour choisir ou créer un voyage.</p></div>';
}
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
