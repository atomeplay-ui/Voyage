<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef2f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07080c" media="(prefers-color-scheme: dark)">
<title>Mes voyages</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
<style>
  /* Style « Liquid Glass » : panneaux de verre translucides flottant sur un fond coloré */
  :root {
    --text: #0b0d12; --muted: rgba(11,13,18,.55);
    --accent: #007aff; --danger: #ff3b30;
    --glass: rgba(255,255,255,.52); --glass-strong: rgba(255,255,255,.72);
    --glass-border: rgba(255,255,255,.7); --glass-hi: rgba(255,255,255,.9); --glass-press: rgba(255,255,255,.55);
    --shadow: 0 10px 40px rgba(20,30,60,.16);
    --bg-base: #eef2f8; --blob1: #8ec5ff; --blob2: #ffb3d9; --blob3: #9ef0c4; --blob4: #ffd59e;
    --top-h: 56px; --bar-h: 64px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #f2f4f8; --muted: rgba(242,244,248,.6); --accent: #0a84ff; --danger: #ff453a;
      --glass: rgba(40,44,54,.45); --glass-strong: rgba(40,44,54,.65);
      --glass-border: rgba(255,255,255,.14); --glass-hi: rgba(255,255,255,.22); --glass-press: rgba(255,255,255,.12);
      --shadow: 0 10px 40px rgba(0,0,0,.45);
      --bg-base: #07080c; --blob1: #1d4ed8; --blob2: #86198f; --blob3: #047857; --blob4: #b45309;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color: var(--text); background: var(--bg-base); min-height: 100vh; }
  /* Fond coloré fixe, visible à travers le verre */
  body::before { content: ''; position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(55% 45% at 12% 8%, var(--blob1), transparent 70%),
      radial-gradient(50% 40% at 92% 22%, var(--blob2), transparent 70%),
      radial-gradient(60% 45% at 20% 88%, var(--blob3), transparent 70%),
      radial-gradient(45% 40% at 88% 92%, var(--blob4), transparent 70%),
      var(--bg-base); }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }

  /* Matière verre partagée */
  .top, #drawer, #actions, #note, .item, #toast, #new input, .welcome, .empty {
    background: var(--glass);
    -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow: inset 0 1px 0 var(--glass-hi), inset 0 -1px 1px rgba(255,255,255,.06), var(--shadow);
  }
  #actions > *:active { background: var(--glass-press); transform: scale(.96); }
  #actions > * { transition: transform .15s ease, background .15s; }

  /* Barre du haut flottante */
  .top { position: sticky; z-index: 10; top: calc(env(safe-area-inset-top) + 8px); margin: calc(env(safe-area-inset-top) + 8px) 10px 0;
    height: var(--top-h); padding: 0 6px; border-radius: 999px; display: flex; align-items: center; gap: 6px; }
  .top h1 { flex: 1; margin: 0; font-size: 17px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon { width: 44px; height: 44px; border-radius: 50%; font-size: 18px; display: grid; place-items: center; }
  .top .icon { background: var(--glass-press); }
  #delTrip { color: var(--danger); }
  .top .spacer { width: 44px; }

  /* Menu latéral en verre */
  #drawer { position: fixed; z-index: 30; top: calc(env(safe-area-inset-top) + 8px); bottom: calc(env(safe-area-inset-bottom) + 8px); left: 8px;
    width: min(80vw, 310px); border-radius: 32px; padding: 20px 14px; display: flex; flex-direction: column;
    background: var(--glass-strong); transform: translateX(calc(-100% - 16px)); transition: transform .35s cubic-bezier(.3,1.2,.5,1); }
  body.menu-open #drawer { transform: none; }
  #backdrop { position: fixed; z-index: 20; inset: 0; background: rgba(0,0,0,.18); opacity: 0; pointer-events: none; transition: opacity .3s; }
  body.menu-open #backdrop { opacity: 1; pointer-events: auto; }
  #drawer h2 { margin: 4px 8px 16px; font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  #drawer h2 i { color: var(--accent); }
  #new { display: flex; gap: 8px; margin-bottom: 14px; }
  #new input { flex: 1; min-width: 0; height: 44px; padding: 0 16px; border-radius: 999px; box-shadow: inset 0 1px 0 var(--glass-hi); outline: none; }
  #new input::placeholder { color: var(--muted); }
  #new button { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 18px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 6px 16px rgba(0,122,255,.35); }
  #tripList { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  #tripList a { display: flex; font-size: 16px; align-items: center; gap: 12px; padding: 13px 14px; margin-bottom: 4px; border-radius: 18px; text-decoration: none; color: inherit; transition: background .15s; }
  #tripList a i { color: var(--accent); width: 20px; text-align: center; }
  #tripList a:active { background: var(--glass-press); }
  #tripList a.active { background: var(--glass-hi); font-weight: 600; box-shadow: inset 0 1px 0 var(--glass-hi), 0 2px 10px rgba(0,0,0,.08); }
  .empty-list { color: var(--muted); padding: 12px; }

  /* Contenu */
  main { padding: 14px 10px calc(var(--bar-h) + env(safe-area-inset-bottom) + 32px); max-width: 900px; margin: auto; }
  .welcome, .empty { text-align: center; color: var(--muted); margin: 18vh auto 0; padding: 28px 24px; border-radius: 28px; max-width: 320px; }
  .welcome i { font-size: 48px; color: var(--accent); }
  #note { display: flex; gap: 8px; align-items: flex-end; border-radius: 26px; padding: 6px; margin-bottom: 12px; }
  #note textarea { flex: 1; border: 0; background: none; resize: none; min-height: 44px; max-height: 40vh; padding: 11px 12px; outline: none; field-sizing: content; }
  #note textarea::placeholder { color: var(--muted); }
  #note button { height: 44px; padding: 0 18px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 600;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 6px 16px rgba(0,122,255,.3); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 600px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .item { position: relative; border-radius: 22px; overflow: hidden; padding: 0; }
  .item.wide { grid-column: 1 / -1; padding: 14px 52px 14px 16px; }
  .item img, .item video { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: #000; }
  .item audio { width: 100%; }
  .item pre { margin: 0; white-space: pre-wrap; font-family: inherit; line-height: 1.45; }
  .item time { display: block; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .del { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%; color: #fff; font-size: 13px;
    background: rgba(0,0,0,.28); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.3); }
  .item.wide .del { color: var(--text); background: var(--glass-press); border-color: var(--glass-border); }
  .empty { grid-column: 1 / -1; }

  /* Barre d'actions flottante (capsule) */
  #actions { position: fixed; z-index: 10; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 14px); transform: translateX(-50%);
    display: flex; gap: 4px; padding: 6px; border-radius: 999px; }
  #actions > * { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 88px; padding: 7px 18px; border-radius: 999px; font-size: 11px; font-weight: 600; color: var(--text); }
  #actions i { font-size: 20px; height: 24px; display: grid; place-items: center; color: var(--accent); }
  #actions b { font-weight: inherit; }
  #rec.on { background: var(--danger); color: #fff; animation: pulse 1.2s infinite; }
  #rec.on i { color: #fff; }
  @keyframes pulse { 50% { opacity: .65; } }
  #toast { position: fixed; z-index: 60; left: 50%; bottom: calc(var(--bar-h) + env(safe-area-inset-bottom) + 26px); transform: translateX(-50%);
    padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; max-width: 90vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--glass-strong); }
  [hidden] { display: none !important; }

  /* Caméra intégrée, façon appareil photo iOS (boutons en verre sombre) */
  #cam { position: fixed; z-index: 50; inset: 0; background: #000; color: #fff; display: flex; flex-direction: column;
    touch-action: none; user-select: none; -webkit-user-select: none; }
  .cam-glass { background: rgba(255,255,255,.14); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255,255,255,.22); box-shadow: inset 0 1px 0 rgba(255,255,255,.35); }
  .cam-top { position: absolute; z-index: 1; inset: 0 0 auto 0; padding: calc(env(safe-area-inset-top) + 10px) 14px 0; display: flex; align-items: center; justify-content: space-between; }
  .cam-top button, .cam-top span.spacer { width: 44px; height: 44px; border-radius: 50%; color: #fff; font-size: 20px; }
  #camRec.on { background: var(--danger); border-color: transparent; animation: pulse 1.2s infinite; }
  #cam.rec #camRec { visibility: hidden; }
  #camTimer { font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 600; padding: 6px 14px; border-radius: 999px; }
  #cam[data-mode=photo] #camTimer { visibility: hidden; }
  #cam.rec #camTimer { background: var(--danger); border-color: transparent; }
  .cam-view { flex: 1; position: relative; overflow: hidden; }
  #camView { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .1s; }
  #cam.front #camView { transform: scaleX(-1); }
  #cam.flash #camView { opacity: 0; }
  .cam-bottom { position: absolute; inset: auto 0 0 0; padding: 0 0 calc(env(safe-area-inset-bottom) + 24px); }
  .modes { display: flex; gap: 22px; height: 38px; align-items: center; transition: transform .3s ease; width: 100%; }
  .modes button { color: #fff; font-size: 13px; font-weight: 600; letter-spacing: .1em; padding: 6px 12px; border-radius: 999px; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .modes button.on { color: #ffd60a; background: rgba(0,0,0,.35); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  #cam.rec .modes { visibility: hidden; }
  .cam-row { display: flex; align-items: center; justify-content: space-between; margin: 12px 20px 0; padding: 12px 18px; border-radius: 999px; }
  #camImport { width: 50px; height: 50px; border-radius: 14px; background: rgba(255,255,255,.12) center / cover; border: 1.5px solid rgba(255,255,255,.7);
    display: grid; place-items: center; font-size: 20px; cursor: pointer; }
  #camImport.thumb i { display: none; }
  #camImport input { display: none; }
  #camFlip { width: 50px; height: 50px; border-radius: 50%; color: #fff; font-size: 20px; }
  #cam.rec #camImport, #cam.rec #camFlip { visibility: hidden; }
  #shutter { width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; padding: 4px; display: grid; place-items: center; }
  #shutter::after { content: ''; width: 100%; height: 100%; border-radius: 50%; background: #fff; transition: all .25s ease; }
  #shutter:active::after { transform: scale(.9); }
  #cam[data-mode=video] #shutter::after { background: var(--danger); }
  #cam.rec #shutter::after { width: 42%; height: 42%; border-radius: 6px; }
  body.cam-open #toast { bottom: auto; top: calc(env(safe-area-inset-top) + 64px); }

  /* Grand écran : menu toujours visible */
  @media (min-width: 900px) {
    #drawer { transform: none; }
    #backdrop, #menuBtn { display: none; }
    body { padding-left: 330px; }
    #actions { left: calc(50% + 165px); }
  }
</style>
</head>
<body>
<header class="top">
  <button class="icon" id="menuBtn" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
  <h1 id="title">Mes voyages</h1>
  <button class="icon" id="delTrip" aria-label="Supprimer le voyage" hidden><i class="fa-solid fa-trash-can"></i></button>
</header>

<nav id="drawer">
  <h2><i class="fa-solid fa-suitcase-rolling"></i> Mes voyages</h2>
  <form id="new"><input name="name" placeholder="Nouveau voyage" required><button aria-label="Créer"><i class="fa-solid fa-plus"></i></button></form>
  <ul id="tripList"></ul>
</nav>
<div id="backdrop"></div>

<main id="main"></main>

<footer id="actions" hidden>
  <button id="camBtn"><i class="fa-solid fa-camera"></i>Caméra</button>
  <button id="rec"><i class="fa-solid fa-microphone"></i><b>Audio</b></button>
</footer>
<div id="toast" hidden></div>

<div id="cam" hidden>
  <div class="cam-top">
    <button id="camClose" class="cam-glass" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button>
    <span id="camTimer" class="cam-glass">00:00:00</span>
    <button id="camRec" class="cam-glass" aria-label="Enregistrer un audio"><i class="fa-solid fa-microphone"></i></button>
  </div>
  <div class="cam-view"><video id="camView" autoplay playsinline muted></video></div>
  <div class="cam-bottom">
    <div class="modes" id="modes"><button data-mode="video">VIDÉO</button><button data-mode="photo">PHOTO</button></div>
    <div class="cam-row cam-glass">
      <label id="camImport" aria-label="Importer depuis la galerie"><i class="fa-solid fa-images"></i><input type="file" multiple accept="image/*,video/*,audio/*,text/plain"></label>
      <button id="shutter" aria-label="Déclencher"></button>
      <button id="camFlip" class="cam-glass" aria-label="Changer de caméra"><i class="fa-solid fa-camera-rotate"></i></button>
    </div>
  </div>
</div>

<script type="module">
import { uploadPresigned } from 'https://esm.sh/@vercel/blob@2.8.0/client';

const $ = s => document.querySelector(s);
const main = $('#main'), toast = $('#toast');
const esc = s => s.replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
const currentTrip = () => decodeURIComponent(location.hash.slice(1));

async function api(q = '', opts = {}) {
  const r = await fetch('/api/trips' + q, { ...opts, headers: { 'content-type': 'application/json' } });
  const json = await r.json();
  if (!r.ok) { alert(json.error || 'Erreur'); throw new Error(json.error); }
  return json;
}

// Menu
// Accolades volontaires : un onclick qui renvoie false annule le clic (le lien ne s'ouvrait plus).
const setMenu = open => { document.body.classList.toggle('menu-open', open); };
$('#menuBtn').onclick = () => setMenu(true);
$('#backdrop').onclick = () => setMenu(false);

async function loadTrips() {
  const trips = await api();
  const cur = currentTrip();
  $('#tripList').innerHTML = trips.length
    ? trips.map(t => `<li><a href="#${encodeURIComponent(t)}" class="${t === cur ? 'active' : ''}"><i class="fa-solid ${t === cur ? 'fa-folder-open' : 'fa-folder'}"></i> ${esc(t)}</a></li>`).join('')
    : '<li class="empty-list">Aucun voyage pour l’instant.</li>';
}
$('#tripList').onclick = e => {
  const a = e.target.closest('a');
  if (!a) return;
  e.preventDefault();
  setMenu(false);
  if (location.hash === a.hash) route(); else location.hash = a.hash;
};

$('#new').onsubmit = async e => {
  e.preventDefault();
  const name = e.target.name.value.trim();
  await api('', { method: 'POST', body: JSON.stringify({ name }) });
  e.target.reset();
  setMenu(false);
  location.hash = encodeURIComponent(name);
};

// Envoi des médias
async function send(files) {
  const trip = currentTrip();
  try {
    for (const [i, f] of [...files].entries()) {
      toast.hidden = false;
      toast.textContent = `Envoi ${i + 1}/${files.length} : ${f.name}…`;
      await uploadPresigned(`trips/${trip}/${f.name}`, f, { access: 'private', handleUploadUrl: '/api/upload' });
    }
  } catch (e) {
    alert('Échec de l’envoi : ' + e.message);
  }
  toast.hidden = true;
  if (currentTrip() === trip) loadItems(trip);
}
$('#camImport input').onchange = e => send(e.target.files).finally(() => e.target.value = '');

// Caméra intégrée, façon appareil photo iOS : glisser pour passer de PHOTO à VIDÉO
const cam = $('#cam'), camView = $('#camView'), camTimer = $('#camTimer'), modes = $('#modes');
let camStream, camRec, camTick, camReq = 0, facing = 'environment';

async function startCam() {
  const req = ++camReq; // ignore les demandes dépassées (changement de mode rapide)
  camStream?.getTracks().forEach(t => t.stop());
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: cam.dataset.mode === 'video',
    });
  } catch (e) {
    alert('Impossible d’accéder à la caméra : ' + e.message);
    return closeCam();
  }
  if (req !== camReq || cam.hidden) return stream.getTracks().forEach(t => t.stop());
  camView.srcObject = camStream = stream;
  cam.classList.toggle('front', facing === 'user');
}

function setMode(mode) {
  if (camRec || mode === cam.dataset.mode) return;
  cam.dataset.mode = mode;
  modes.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  centerMode();
  startCam();
}

// Centre le mode actif sous l'aperçu, comme le sélecteur d'iOS
function centerMode() {
  const on = modes.querySelector('.on');
  if (on) modes.style.transform = `translateX(${modes.offsetWidth / 2 - on.offsetLeft - on.offsetWidth / 2}px)`;
}
addEventListener('resize', centerMode);

function openCam() {
  cam.hidden = false;
  document.body.classList.add('cam-open');
  cam.dataset.mode = '';
  setMode('photo');
}

function closeCam() {
  camRec?.stop(); // une vidéo en cours est enregistrée, pas perdue
  camReq++;
  camStream?.getTracks().forEach(t => t.stop());
  camStream = null;
  camView.srcObject = null;
  cam.hidden = true;
  document.body.classList.remove('cam-open');
}

function takePhoto() {
  const c = document.createElement('canvas');
  c.width = camView.videoWidth;
  c.height = camView.videoHeight;
  if (!c.width) return;
  c.getContext('2d').drawImage(camView, 0, 0);
  cam.classList.add('flash');
  setTimeout(() => cam.classList.remove('flash'), 120);
  c.toBlob(b => {
    // Miniature de la dernière photo, comme sur iOS
    $('#camImport').style.backgroundImage = `url(${URL.createObjectURL(b)})`;
    $('#camImport').classList.add('thumb');
    send([new File([b], `photo-${Date.now()}.jpg`, { type: 'image/jpeg' })]);
  }, 'image/jpeg', 0.9);
}

const hms = s => [s / 3600, s / 60 % 60, s % 60].map(n => String(Math.floor(n)).padStart(2, '0')).join(':');

function toggleVideo() {
  if (camRec) return camRec.stop();
  if (!camStream) return;
  const chunks = [], start = Date.now();
  camRec = new MediaRecorder(camStream);
  camRec.ondataavailable = e => chunks.push(e.data);
  camRec.onstop = () => {
    const type = (camRec.mimeType || 'video/webm').split(';')[0];
    camRec = null;
    clearInterval(camTick);
    camTimer.textContent = hms(0);
    cam.classList.remove('rec');
    send([new File(chunks, `video-${Date.now()}.${type.includes('mp4') ? 'mp4' : 'webm'}`, { type })]);
  };
  camRec.start();
  cam.classList.add('rec');
  camTick = setInterval(() => { camTimer.textContent = hms((Date.now() - start) / 1000); }, 500);
}

$('#camBtn').onclick = openCam;
$('#camClose').onclick = closeCam;
$('#camFlip').onclick = () => { if (camRec) return; facing = facing === 'user' ? 'environment' : 'user'; startCam(); };
$('#shutter').onclick = () => { cam.dataset.mode === 'photo' ? takePhoto() : toggleVideo(); };
modes.onclick = e => { if (e.target.dataset.mode) setMode(e.target.dataset.mode); };
// Glisser à droite -> VIDÉO, à gauche -> PHOTO
let touchX = null;
cam.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
cam.addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  touchX = null;
  if (Math.abs(dx) > 50) setMode(dx > 0 ? 'video' : 'photo');
});
addEventListener('keydown', e => e.key === 'Escape' && !cam.hidden && closeCam());

// Enregistrement audio (bouton de la barre du bas et bouton de la caméra)
let rec;
const recBtns = document.querySelectorAll('#rec, #camRec');
function setRecUI(on) {
  recBtns.forEach(b => {
    b.classList.toggle('on', on);
    b.querySelector('i').className = `fa-solid ${on ? 'fa-stop' : 'fa-microphone'}`;
    const label = b.querySelector('b');
    if (label) label.textContent = on ? 'Arrêter' : 'Audio';
  });
}
recBtns.forEach(b => b.onclick = async () => {
  if (rec) return rec.stop();
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  rec = new MediaRecorder(stream);
  const chunks = [];
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    const type = rec.mimeType.split(';')[0];
    const ext = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'weba';
    rec = null;
    setRecUI(false);
    send([new File(chunks, `audio-${Date.now()}.${ext}`, { type })]);
  };
  rec.start();
  setRecUI(true);
});

$('#delTrip').onclick = async () => {
  const trip = currentTrip();
  if (!confirm(`Supprimer « ${trip} » et tout son contenu ?`)) return;
  await api(`?trip=${encodeURIComponent(trip)}`, { method: 'DELETE' });
  location.hash = '';
};

// Affichage d'un voyage
function showTrip(trip) {
  main.innerHTML = `<form id="note"><textarea name="text" rows="1" placeholder="Écrire une note…"></textarea><button>Ajouter</button></form>
    <div class="grid" id="items"></div>`;
  $('#note').onsubmit = e => {
    e.preventDefault();
    const text = e.target.text.value.trim();
    if (!text) return;
    e.target.reset();
    send([new File([text], `note-${Date.now()}.txt`, { type: 'text/plain' })]);
  };
  loadItems(trip);
}

async function loadItems(trip) {
  const blobs = (await api(`?trip=${encodeURIComponent(trip)}`))
    .sort((a, b) => b.uploadedAt.localeCompare(a.uploadedAt));
  const box = $('#items');
  if (!box || currentTrip() !== trip) return;
  box.innerHTML = blobs.length ? '' : '<p class="empty" style="grid-column:1/-1">Ce voyage est vide.<br>Ajoutez une photo, une vidéo, un audio ou une note.</p>';
  for (const b of blobs) {
    const ext = b.pathname.split('.').pop().toLowerCase();
    const date = new Date(b.uploadedAt).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' });
    const el = document.createElement('div');
    el.className = 'item';
    if (/^(jpe?g|png|gif|webp|avif|heic)$/.test(ext)) el.innerHTML = `<a href="${b.src}" target="_blank"><img src="${b.src}" loading="lazy" alt=""></a>`;
    else if (/^(mp4|mov|webm|m4v)$/.test(ext)) el.innerHTML = `<video src="${b.src}#t=0.1" controls playsinline preload="metadata"></video>`;
    else {
      el.classList.add('wide');
      if (/^(weba|m4a|mp3|wav|ogg|aac|opus)$/.test(ext)) el.innerHTML = `<audio src="${b.src}" controls></audio><time>${date}</time>`;
      else if (ext === 'txt') { el.innerHTML = `<pre></pre><time>${date}</time>`; fetch(b.src).then(r => r.text()).then(t => el.firstChild.textContent = t); }
      else el.innerHTML = `<a href="${b.src}" target="_blank">${esc(b.pathname.split('/').pop())}</a>`;
    }
    const del = document.createElement('button');
    del.className = 'del'; del.innerHTML = '<i class="fa-solid fa-xmark"></i>'; del.setAttribute('aria-label', 'Supprimer');
    del.onclick = async () => {
      if (!confirm('Supprimer ce média ?')) return;
      await api(`?url=${encodeURIComponent(b.url)}`, { method: 'DELETE' });
      el.remove();
    };
    el.append(del);
    box.append(el);
  }
}

function route() {
  const trip = currentTrip();
  $('#title').textContent = trip || 'Mes voyages';
  $('#delTrip').hidden = $('#actions').hidden = !trip;
  loadTrips();
  setMenu(!trip);
  if (trip) return showTrip(trip);
  main.innerHTML = '<div class="welcome"><i class="fa-solid fa-suitcase-rolling"></i><p>Ouvrez le menu pour choisir ou créer un voyage.</p></div>';
}
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
