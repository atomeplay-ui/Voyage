<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07080c" media="(prefers-color-scheme: dark)">
<title>Mes voyages</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
  /* Style « Liquid Glass » : panneaux de verre translucides flottant sur un fond coloré */
  :root {
    --text: #0b0d12; --muted: rgba(11,13,18,.55);
    --accent: #007aff; --danger: #ff3b30;
    --glass: rgba(255,255,255,.52); --glass-strong: rgba(255,255,255,.72);
    --glass-border: rgba(255,255,255,.7); --glass-hi: rgba(255,255,255,.9); --glass-press: rgba(255,255,255,.55);
    --shadow: 0 10px 40px rgba(20,30,60,.16);
    --bg-base: #fff; --blob1: transparent; --blob2: transparent; --blob3: transparent; --blob4: transparent;
    --surface: #fff; --surface-line: rgba(0,0,0,.07); --card-shadow: 0 8px 24px rgba(20,30,60,.12);
    --top-h: 56px; --bar-h: 64px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #f2f4f8; --muted: rgba(242,244,248,.6); --accent: #0a84ff; --danger: #ff453a;
      --glass: rgba(40,44,54,.45); --glass-strong: rgba(40,44,54,.65);
      --glass-border: rgba(255,255,255,.14); --glass-hi: rgba(255,255,255,.22); --glass-press: rgba(255,255,255,.12);
      --shadow: 0 10px 40px rgba(0,0,0,.45);
      --bg-base: #07080c; --blob1: #1d4ed8; --blob2: #86198f; --blob3: #047857; --blob4: #b45309;
      --surface: #1c1f27; --surface-line: rgba(255,255,255,.07); --card-shadow: 0 8px 24px rgba(0,0,0,.45);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color: var(--text); background: var(--bg-base); min-height: 100vh; }
  /* Fond coloré fixe, visible à travers le verre */
  body::before { content: ''; position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(55% 45% at 12% 8%, var(--blob1), transparent 70%),
      radial-gradient(50% 40% at 92% 22%, var(--blob2), transparent 70%),
      radial-gradient(60% 45% at 20% 88%, var(--blob3), transparent 70%),
      radial-gradient(45% 40% at 88% 92%, var(--blob4), transparent 70%),
      var(--bg-base); }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }

  /* Matière verre partagée : réservée à la navigation et aux contrôles (règle Apple Liquid Glass) */
  #drawer, #note, #toast, .tabs, .map-sheet {
    background: var(--glass);
    -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow: inset 0 1px 0 var(--glass-hi), inset 0 -1px 1px rgba(255,255,255,.06), var(--shadow);
  }
  /* Contenu (photos, notes, audios, messages) : surfaces opaques, pas de verre */
  .item:not(.audio), .ring, .empty { background: var(--surface); border: 1px solid var(--surface-line); box-shadow: var(--card-shadow); }
  /* Verre interactif (façon iOS 26) : sous le doigt, le bouton grossit et s'illumine à l'endroit touché, puis rebondit */
  .pressed { transform: scale(1.08); transition: transform .25s cubic-bezier(.3,1.5,.5,1);
    background-image: radial-gradient(circle at var(--px, 50%) var(--py, 50%), rgba(255,255,255,.55), rgba(255,255,255,0) 70%) !important; }
  @media (prefers-reduced-motion: reduce) { .pressed { transform: none; } }

  /* Barre du haut flottante */
  .top { position: sticky; z-index: 10; top: calc(env(safe-area-inset-top) + 8px); margin: calc(env(safe-area-inset-top) + 8px) 10px 0;
    height: var(--top-h); padding: 0 6px; border-radius: 999px; display: flex; align-items: center; gap: 6px; }
  .top h1 { flex: 1; margin: 0; font-size: 17px; font-weight: 600; text-shadow: 0 1px 2px rgba(255,255,255,.4); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon { width: 44px; height: 44px; border-radius: 50%; font-size: 18px; display: grid; place-items: center; }
  .top .icon { background: var(--glass-press); }
  #delTrip { color: var(--danger); }

  /* Menu latéral en verre */
  #drawer { position: fixed; z-index: 30; top: calc(env(safe-area-inset-top) + 8px); bottom: calc(env(safe-area-inset-bottom) + 8px); left: 8px;
    width: min(80vw, 310px); border-radius: 32px; padding: 20px 14px; display: flex; flex-direction: column;
    background: var(--glass-strong); transform: translateX(calc(-100% - 16px)); transition: transform .35s cubic-bezier(.3,1.2,.5,1); }
  body.menu-open #drawer { transform: none; }
  #backdrop { position: fixed; z-index: 20; inset: 0; background: rgba(0,0,0,.18); opacity: 0; pointer-events: none; transition: opacity .3s; }
  body.menu-open #backdrop { opacity: 1; pointer-events: auto; }
  /* En-tête du menu : mon profil (avatar aux initiales, nom, e-mail), qu'on touche pour le modifier */
  #drawer .me { display: flex; align-items: center; gap: 12px; padding: 6px 8px 14px; text-align: left; border-bottom: 1px solid var(--glass-border); margin-bottom: 10px; }
  .avatar { flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 17px;
    background: linear-gradient(135deg, #0a84ff, #7c3aed); box-shadow: inset 0 1px 1px rgba(255,255,255,.5), 0 4px 12px rgba(88,86,214,.3); }
  .me-text { flex: 1; min-width: 0; }
  .me-text b, .me-text small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .me-text b { font-size: 17px; }
  .me-text small { font-size: 12px; color: var(--muted); }
  #drawer .me > i { color: var(--muted); font-size: 13px; }
  /* Lignes du menu : pastille d'icône colorée, nom, détail */
  #tripList { overflow-y: auto; flex: 1; margin: 0 -4px; padding: 0 4px; }
  .nav-label { margin: 12px 10px 6px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  #drawer a { display: flex; align-items: center; gap: 12px; padding: 8px 10px; margin-bottom: 2px; border-radius: 18px; text-decoration: none; color: inherit; transition: background .15s, transform .15s; }
  #drawer a:active { background: var(--glass-press); transform: scale(.98); }
  #drawer a.active { background: var(--glass-hi); box-shadow: inset 0 1px 0 var(--glass-hi), 0 2px 10px rgba(0,0,0,.08); }
  #drawer a > span:last-child { min-width: 0; }
  #drawer a b { display: block; font-size: 15.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #drawer a small { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tico { flex: none; width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; color: #fff; font-size: 16px;
    background: linear-gradient(150deg, hsl(var(--hue, 211) 80% 58%), hsl(calc(var(--hue, 211) + 40) 75% 46%));
    box-shadow: inset 0 1px 1px rgba(255,255,255,.45), 0 3px 8px hsl(var(--hue, 211) 70% 40% / .28); }
  .empty-list { color: var(--muted); padding: 6px 10px 12px; font-size: 14px; }
  /* Création d'un voyage : nom + choix d'une icône */
  #new { display: grid; gap: 10px; padding: 12px; margin-top: 8px; border-radius: 22px; background: var(--glass-press); border: 1px solid var(--glass-border); }
  #new input[name=name] { height: 44px; padding: 0 14px; border-radius: 14px; outline: none; background: var(--surface); border: 1px solid var(--surface-line); }
  #new input[name=name]:focus { border-color: var(--accent); }
  .icon-pick { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .icon-pick label { aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; cursor: pointer; color: var(--muted); background: rgba(127,127,127,.12); transition: transform .15s, background .15s; }
  .icon-pick input { position: absolute; opacity: 0; pointer-events: none; }
  .icon-pick label:has(:checked) { color: #fff; background: var(--accent); transform: scale(1.08); box-shadow: 0 3px 10px rgba(0,122,255,.35); }
  .icon-pick label:has(:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .new-actions { display: flex; gap: 8px; }
  .new-actions button { flex: 1; height: 42px; border-radius: 14px; font-weight: 600; background: rgba(127,127,127,.14); }
  .new-actions .primary { background: var(--accent); color: #fff; }
  .new-btn { margin-top: 10px; height: 46px; border-radius: 16px; font-weight: 600; color: var(--accent); background: var(--glass-press); border: 1px dashed var(--glass-border); }
  .logout { margin-top: 8px; height: 40px; border-radius: 14px; font-size: 13px; color: var(--muted); }

  /* Partage : bandeau de la vue invitée et fenêtre du lien d'invitation */
  .shared-by { margin: 0 0 12px; text-align: center; font-size: 13px; color: var(--muted); }
  dialog { width: min(360px, calc(100vw - 32px)); padding: 22px; border: 1px solid var(--surface-line); border-radius: 28px;
    background: var(--surface); color: var(--text); box-shadow: 0 24px 70px rgba(0,0,0,.35); text-align: center; }
  dialog::backdrop { background: rgba(0,0,0,.35); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  dialog h3 { margin: 0 0 12px; font-size: 19px; }
  dialog h3 i { color: var(--accent); }
  /* Modifier le voyage : mêmes champs que la création (nom + icône) */
  #editForm { display: grid; gap: 12px; }
  #editForm input[name=name] { height: 46px; padding: 0 14px; border-radius: 14px; outline: none; background: rgba(127,127,127,.1); border: 1px solid var(--surface-line); }
  #editForm input[name=name]:focus { border-color: var(--accent); }
  #editErr { margin: 0; min-height: 0; color: var(--danger); font-size: 14px; }
  #editErr:empty { display: none; }
  /* Titre du voyage : un crayon indique qu'on peut le toucher pour le modifier (propriétaire) */
  #title.editable { cursor: pointer; }
  #title.editable::after { content: '\f304'; font: var(--fa-font-solid); font-size: 11px; margin-left: 7px; opacity: .55; vertical-align: 1px; }
  #shareDlg p { margin: 0 0 14px; font-size: 14px; color: var(--muted); }
  #shareDlg input { width: 100%; height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--surface-line); background: rgba(127,127,127,.1); font-size: 13px; outline: none; }
  #shareDlg button { width: 100%; height: 44px; margin-top: 10px; border-radius: 12px; font-weight: 600; background: rgba(127,127,127,.14); }
  #shareDlg .dlg-row { display: flex; gap: 8px; }
  #shareDlg #shareCopy { background: var(--accent); color: #fff; }
  #shareDlg #shareOff { color: var(--danger); }
  #shareDlg #shareClose { background: none; color: var(--muted); }
  #shareDlg .tabs { margin: 0 auto 12px; box-shadow: none; background: rgba(127,127,127,.14); border: 0; -webkit-backdrop-filter: none; backdrop-filter: none; }
  #shareDlg .tabs button { width: auto; height: auto; margin: 0; background: none; padding: 7px 16px; }
  #shareDlg .tabs button.on { background: var(--surface); }
  #memberBox { margin-top: 14px; text-align: left; }
  #memberBox h4 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
  #memberList { list-style: none; margin: 0; padding: 0; max-height: 132px; overflow-y: auto; }
  #memberList li { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 14px; }
  #memberList li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #memberList li.none { color: var(--muted); font-size: 13px; }
  #shareDlg #memberList button { width: auto; height: 32px; margin: 0; padding: 0 12px; font-size: 13px; color: var(--danger); }

  /* Écran de connexion (rien d'autre n'est visible tant qu'on n'est pas connecté) */
  body.logged-out #drawer, body.logged-out #backdrop, body.logged-out #actions, body.logged-out .top .icon { display: none; }
  .login { max-width: 360px; margin: 6vh auto 0; padding: 28px 22px; border-radius: 30px; text-align: center;
    background: var(--surface); border: 1px solid var(--surface-line); box-shadow: var(--card-shadow); }
  .login > i { font-size: 44px; color: var(--accent); }
  .login h2 { margin: 12px 0 4px; font-size: 24px; letter-spacing: -.02em; }
  .login p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .login form { display: grid; gap: 10px; }
  .login input { height: 48px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--surface-line); background: rgba(127,127,127,.1); outline: none; }
  .login input:focus { border-color: var(--accent); }
  .login form button, .login .social { height: 48px; border-radius: 14px; font-weight: 600; }
  .login form button { background: var(--accent); color: #fff; }
  .login .social { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--text); color: var(--surface); }
  .login .or { display: flex; align-items: center; gap: 10px; margin: 14px 0; color: var(--muted); font-size: 13px; }
  .login .or::before, .login .or::after { content: ''; flex: 1; height: 1px; background: var(--surface-line); }
  .login .login-err { margin: 12px 0 0; min-height: 18px; color: var(--danger); }
  .login .link { margin-top: 6px; color: var(--accent); font-weight: 600; }

  /* Contenu */
  main { padding: 14px 10px calc(var(--bar-h) + env(safe-area-inset-bottom) + 32px); max-width: 900px; margin: auto; }
  .empty { text-align: center; color: var(--muted); margin: 18vh auto 0; padding: 28px 24px; border-radius: 28px; max-width: 320px; }
  #note { display: flex; gap: 8px; align-items: flex-end; border-radius: 26px; padding: 6px; margin-bottom: 12px; }
  #note textarea { flex: 1; border: 0; background: none; resize: none; min-height: 44px; max-height: 40vh; padding: 11px 12px; outline: none; field-sizing: content; }
  #note textarea::placeholder { color: var(--muted); }
  #note button { height: 44px; padding: 0 18px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 600;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 6px 16px rgba(0,122,255,.3); }
  /* Onglets Souvenirs / Carte */
  .tabs { display: flex; gap: 2px; width: max-content; margin: 0 auto 12px; padding: 3px; border-radius: 999px; }
  .tabs button { padding: 7px 20px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--muted); transition: background .2s, color .2s; }
  .tabs button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  /* Carte (contenu : surface opaque, pas de verre) */
  #map { height: calc(100dvh - 230px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); min-height: 320px; border-radius: 24px; overflow: hidden;
    isolation: isolate; border: 1px solid var(--surface-line); box-shadow: var(--card-shadow); background: var(--surface); }
  .map-empty { text-align: center; color: var(--muted); font-size: 14px; margin: 12px 20px 0; }
  /* Accueil : carte de tous les voyages, plus haute (pas d'onglets ni de champ de note) */
  /* Accueil : bonjour, chiffres, voyages en cartes illustrées (carrousel), carte compacte */
  .home-title { margin: 4px 6px 2px; font-size: 26px; font-weight: 700; letter-spacing: -.02em; overflow-wrap: anywhere; }
  .home-stats { margin: 0 6px 14px; color: var(--muted); font-size: 14px; }
  .home-stats b { color: var(--text); }
  .home-h { margin: 22px 6px 10px; font-size: 18px; }
  .trip-cards { display: flex; gap: 12px; margin: 0 -10px; padding: 4px 10px 14px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 10px; scrollbar-width: none; }
  .trip-cards::-webkit-scrollbar { display: none; }
  .trip-card { position: relative; flex: 0 0 min(64vw, 250px); aspect-ratio: 4 / 5; border-radius: 26px; overflow: hidden; scroll-snap-align: start;
    display: grid; place-items: center; color: #fff; text-decoration: none; box-shadow: var(--card-shadow); transition: transform .2s cubic-bezier(.3,1.4,.5,1);
    background: linear-gradient(160deg, hsl(var(--hue, 210) 70% 58%), hsl(calc(var(--hue, 210) + 50) 70% 42%)); }
  .trip-card:active { transform: scale(.97); }
  .trip-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .trip-card > i { font-size: 44px; opacity: .85; }
  .trip-card .info { position: absolute; inset: auto 0 0 0; padding: 40px 16px 14px; text-align: left; display: grid; gap: 1px;
    background: linear-gradient(transparent, rgba(0,0,0,.72)); }
  .trip-card .info b { font-size: 20px; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trip-card .info small { font-size: 12.5px; opacity: .88; }
  .trip-card .badge { position: absolute; top: 12px; left: 12px; max-width: calc(100% - 24px); padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: rgba(0,0,0,.4); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .trip-card .info b i { font-size: 15px; margin-right: 4px; opacity: .9; }
  /* Derniers souvenirs : cartes dans le style des cartes de voyage, une présentation par type, le voyage en bas */
  .recent { display: flex; gap: 10px; margin: 0 -10px; padding: 2px 10px 12px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 10px; scrollbar-width: none; }
  .recent::-webkit-scrollbar { display: none; }
  .mem { position: relative; flex: 0 0 132px; height: 168px; border-radius: 22px; overflow: hidden; scroll-snap-align: start; text-align: left; color: var(--text);
    background: var(--surface); border: 1px solid var(--surface-line); box-shadow: 0 6px 18px rgba(20,30,60,.1); transition: transform .2s cubic-bezier(.3,1.4,.5,1); }
  .mem:active { transform: scale(.96); }
  .mem img, .mem video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .mem .cap { position: absolute; inset: auto 0 0 0; padding: 8px 12px 10px; font-size: 11.5px; font-weight: 600; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mem .cap i { font-size: 10.5px; margin-right: 3px; color: hsl(var(--hue) 70% 50%); }
  /* Photo et vidéo : image pleine carte, légende blanche sur dégradé (comme les cartes de voyage) */
  .mem.img .cap, .mem.vid .cap { padding-top: 26px; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.7)); }
  .mem.img .cap i, .mem.vid .cap i { color: #fff; }
  /* Note : guillemet et texte lisible, coupé proprement */
  .mem.note { padding: 14px 13px 34px; }
  .mem.note > i { color: var(--accent); font-size: 15px; opacity: .85; }
  .mem.note p { margin: 6px 0 0; font-size: 13px; line-height: 1.4; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  /* Audio : rond de lecture (comme dans le voyage) sur un fond légèrement teinté */
  .mem.aud { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding-bottom: 26px;
    background: linear-gradient(165deg, color-mix(in srgb, var(--accent) 14%, var(--surface)), var(--surface) 70%); }
  .mem-ring { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); font-size: 18px; background: var(--surface);
    border: 4px solid color-mix(in srgb, var(--accent) 22%, transparent); box-shadow: 0 4px 12px rgba(0,122,255,.18); }
  .mem-ring i { margin-left: 3px; }
  .mem-kind { font-size: 12px; font-weight: 600; color: var(--muted); }
  .trip-card.new { flex-basis: min(42vw, 170px); background: var(--surface); color: var(--accent); border: 2px dashed var(--surface-line); box-shadow: none; }
  .trip-card.new .info { background: none; color: var(--text); text-align: center; }
  .trip-card.new .info b { font-size: 15px; }
  .home-map #map { height: 340px; min-height: 0; }
  .sheet-head #sheetOpen { margin-left: auto; margin-right: 8px; padding: 6px 12px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; }
  .sheet-head b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Point sur la carte : miniatures façon Polaroid empilées en éventail, avec une pointe et le nombre de médias */
  .pin { width: 54px; height: 54px; cursor: pointer; }
  .pin::after { content: ''; position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%); border: 8px solid transparent; border-top-color: var(--surface); border-bottom: 0; }
  .pin .card { position: absolute; inset: 0; border-radius: 14px; background: var(--surface); border: 3px solid var(--surface); overflow: hidden;
    display: grid; place-items: center; box-shadow: 0 6px 16px rgba(0,0,0,.35);
    transform: rotate(calc(var(--i) * 11deg)) translateX(calc(var(--i) * 7px)); transform-origin: 50% 100%; transition: transform .25s cubic-bezier(.3,1.4,.5,1); }
  .pin:hover .card { transform: rotate(calc(var(--i) * 16deg)) translateX(calc(var(--i) * 12px)); } /* l'éventail s'ouvre au survol */
  .pin img, .sheet-item img, .sheet-item video { width: 100%; height: 100%; object-fit: cover; }
  .pin img { border-radius: 10px; }
  .pin i { color: var(--accent); font-size: 20px; }
  .pin em, .sheet-item em { font-style: normal; font-size: 8px; line-height: 1.25; padding: 4px; color: var(--text); overflow: hidden; align-self: start; }
  /* Aperçu du lieu : panneau en verre en bas de la carte, bande de miniatures qui défile */
  #mapTab { position: relative; }
  .map-sheet { position: absolute; left: 10px; right: 10px; bottom: 10px; padding: 10px 10px 12px; border-radius: 24px; z-index: 2;
    animation: sheet-in .35s cubic-bezier(.3,1.3,.5,1); }
  @keyframes sheet-in { from { transform: translateY(30px) scale(.96); opacity: 0; } }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin: 0 4px 8px 6px; font-size: 14px; }
  .sheet-head button { width: 30px; height: 30px; border-radius: 50%; background: rgba(127,127,127,.18); font-size: 13px; }
  .sheet-strip { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 2px; }
  .sheet-strip::-webkit-scrollbar { display: none; }
  .sheet-item { position: relative; flex: 0 0 92px; height: 92px; border-radius: 16px; overflow: hidden; scroll-snap-align: start; display: grid; place-items: center;
    background: var(--surface); border: 1px solid var(--surface-line); box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .sheet-item > i { font-size: 24px; color: var(--accent); }
  .sheet-item em { font-size: 11px; padding: 8px; text-align: left; }
  .sheet-item .badge { position: absolute; font-size: 14px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .pin b { position: absolute; top: -9px; right: -9px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; display: grid; place-items: center;
    background: var(--accent); color: #fff; font-size: 12px; border: 2px solid var(--surface); }
  /* Mention des sources : petit ⓘ en verre, qui se déplie au toucher */
  #map .maplibregl-ctrl-attrib { margin: 0 10px 10px 0; border-radius: 999px; font-size: 11px; color: var(--text);
    background: var(--glass); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 var(--glass-hi); }
  #map .maplibregl-ctrl-attrib a { color: inherit; }

  /* Mur de médias « en vrac » : photos flottantes, audios ronds, notes en cartes */
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); grid-auto-flow: dense; gap: 16px 12px; padding: 4px 4px 24px; }
  @media (min-width: 600px) { .grid { grid-template-columns: repeat(9, 1fr); } }
  .item { position: relative; border-radius: 22px; padding: 0; }
  .item.float { grid-column: span var(--span, 3); padding: 6px; border-radius: 20px; margin-top: var(--dy, 0); align-self: start; }
  .item.float img, .item.float video { display: block; width: 100%; aspect-ratio: var(--ar, 1); object-fit: cover; border-radius: 14px; background: #000; cursor: zoom-in; }
  .item.float, .item.audio { transform: translateX(var(--dx, 0)) rotate(var(--r, 0deg)); animation: float var(--d, 6s) ease-in-out var(--delay, 0s) infinite; }
  .item.float:active, .item.float:hover { z-index: 3; }
  @keyframes float {
    0%, 100% { transform: translate(var(--dx, 0), 0) rotate(var(--r, 0deg)); }
    50% { transform: translate(var(--dx, 0), -7px) rotate(calc(var(--r, 0deg) * .6)); }
  }
  @media (prefers-reduced-motion: reduce) { .item.float, .item.audio { animation: none; } }
  .play-badge { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
    color: #fff; font-size: 16px; pointer-events: none; background: rgba(0,0,0,.3); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.35); }
  .play-badge i { margin-left: 3px; }

  /* Visionneuse plein écran */
  body.viewer-open { overflow: hidden; }
  /* Fond en verre dépoli : le voyage reste visible, flouté, derrière. --fade descend vers 0 quand on glisse pour fermer */
  @property --fade { syntax: '<number>'; inherits: true; initial-value: 1; }
  #viewer { --fade: 1; position: fixed; z-index: 55; inset: 0; color: #fff;
    background: rgba(12,14,22, calc(.5 * var(--fade)));
    -webkit-backdrop-filter: blur(calc(36px * var(--fade))) saturate(calc(100% + 80% * var(--fade)));
    backdrop-filter: blur(calc(36px * var(--fade))) saturate(calc(100% + 80% * var(--fade))); }
  #viewer .viewer-top, #viewer .viewer-nav { transition: opacity .2s; }
  #viewer.dragging .viewer-top, #viewer.dragging .viewer-nav { opacity: 0; }
  #viewerTrack { display: flex; height: 100%; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; overscroll-behavior: contain; scrollbar-width: none; }
  #viewerTrack::-webkit-scrollbar { display: none; }
  .slide { flex: 0 0 100%; height: 100%; scroll-snap-align: center; scroll-snap-stop: always; display: grid; place-items: center;
    padding: calc(env(safe-area-inset-top) + 64px) 12px calc(env(safe-area-inset-bottom) + 24px); min-height: 0; }
  .slide img, .slide video { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 18px;
    box-shadow: 0 24px 70px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.18); }
  .slide img { touch-action: pan-x; transform-origin: center; will-change: transform; } /* le pincement est géré par l'appli */
  .viewer-top { position: absolute; inset: 0 0 auto 0; padding: calc(env(safe-area-inset-top) + 10px) 14px 0; display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
  .viewer-top > * { pointer-events: auto; }
  #viewerClose, .viewer-top .spacer { width: 44px; height: 44px; border-radius: 50%; color: #fff; font-size: 20px; }
  #viewerCount { padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .viewer-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 50%; color: #fff; font-size: 18px; display: none; }
  #viewerPrev { left: 16px; } #viewerNext { right: 16px; }
  @media (hover: hover) { .viewer-nav { display: grid; place-items: center; } }

  /* Lecteur audio rond : anneau de progression + durée */
  .item.audio { grid-column: span 2; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 2px 0; align-self: center; }
  .ring { position: relative; width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; transition: box-shadow .3s; }
  .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 5; }
  .ring .track { stroke: color-mix(in srgb, var(--accent) 15%, transparent); }
  .ring .prog { stroke: var(--accent); stroke-linecap: round; stroke-dasharray: 238.76; stroke-dashoffset: 238.76; transition: stroke-dashoffset .25s linear; }
  .ring i { font-size: 22px; color: var(--accent); }
  .ring .fa-play { margin-left: 4px; }
  .item.audio.playing .ring { box-shadow: inset 0 1px 0 var(--glass-hi), 0 0 0 6px color-mix(in srgb, var(--accent) 18%, transparent), var(--shadow); }
  .item.audio .len { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); cursor: zoom-in; }
  .item.audio .del { top: -4px; right: calc(50% - 50px); width: 26px; height: 26px; font-size: 11px; }
  .item pre { margin: 0; white-space: pre-wrap; font-family: inherit; line-height: 1.45; }
  .item time { display: block; font-size: 12px; color: var(--muted); margin-top: 6px; }
  /* Note flottante : carte de verre avec guillemet, texte coupé au-delà de 8 lignes */
  .item.note { padding: 14px 14px 12px; border-radius: 22px; }
  .item.note > i { color: var(--accent); font-size: 16px; opacity: .8; }
  .item.note pre { margin-top: 6px; font-size: 14px; cursor: zoom-in; display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .item.note time { font-size: 11px; }
  .item.note .del { top: 6px; right: 6px; width: 26px; height: 26px; font-size: 11px; }
  /* Grand lecteur audio de la visionneuse */
  .audio-big { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .audio-big .ring { width: min(240px, 62vw); height: min(240px, 62vw); border-radius: 50%; display: grid; place-items: center; position: relative; }
  .audio-big .ring .track { stroke: rgba(255,255,255,.18); }
  .audio-big .ring .prog { stroke: #7cc0ff; }
  .audio-big .ring i { font-size: 58px; color: #fff; }
  .audio-big .ring .fa-play { margin-left: 10px; }
  .audio-big.playing .ring { box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 0 0 14px rgba(124,192,255,.15), 0 20px 60px rgba(0,0,0,.4); }
  .audio-big .len { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .audio-big time { font-size: 13px; opacity: .65; }
  .note-big { max-width: min(560px, 88vw); max-height: 100%; overflow-y: auto; padding: 24px 24px 18px; border-radius: 28px; }
  .note-big > i { color: #7cc0ff; font-size: 22px; }
  .note-big pre { margin: 10px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: inherit; font-size: 19px; line-height: 1.5; }
  .note-big time { display: block; margin-top: 14px; font-size: 13px; opacity: .65; }
  .del { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%; color: #fff; font-size: 13px;
    background: rgba(0,0,0,.28); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.3); }
  .item:is(.audio, .note) .del { color: var(--text); background: rgba(127,127,127,.16); border-color: var(--surface-line); -webkit-backdrop-filter: none; backdrop-filter: none; }
  .item.audio .del { background: var(--glass-strong); }
  .empty { grid-column: 1 / -1; }

  /* « Vrai » Liquid Glass (barres du haut et du bas) : verre presque transparent au centre (on voit le contenu),
     bords épais qui floutent et déforment comme une lentille, reflet brillant et liseré lumineux */
  .lg { background: linear-gradient(135deg, rgba(255,255,255,.26), rgba(255,255,255,.05) 60%, rgba(255,255,255,.14));
    box-shadow: inset 1.5px 1.5px 0 rgba(255,255,255,.8), inset -1px -1px 0 rgba(255,255,255,.3), inset 0 0 14px rgba(255,255,255,.28),
      0 10px 30px rgba(20,30,60,.22), 0 2px 6px rgba(20,30,60,.12); }
  /* Épaisseur du verre : un seul calque qui voit la page, masqué pour être presque net au centre et flou, saturé sur le pourtour */
  .lg::before { content: ''; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none;
    -webkit-backdrop-filter: blur(8px) saturate(210%) brightness(1.05); backdrop-filter: blur(8px) saturate(210%) brightness(1.05);
    -webkit-mask: radial-gradient(closest-side, rgba(0,0,0,.28) 55%, #000 100%); mask: radial-gradient(closest-side, rgba(0,0,0,.28) 55%, #000 100%); }
  /* Reflet spéculaire en haut à gauche */
  .lg::after { content: ''; position: absolute; inset: 1px; z-index: -1; border-radius: inherit; pointer-events: none;
    background: radial-gradient(ellipse 60% 55% at 22% 0%, rgba(255,255,255,.55), transparent 70%),
      radial-gradient(ellipse 40% 40% at 90% 100%, rgba(255,255,255,.18), transparent 70%); }
  @media (prefers-color-scheme: dark) {
    .lg { background: linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,.02) 60%, rgba(255,255,255,.07));
      box-shadow: inset 1.5px 1.5px 0 rgba(255,255,255,.35), inset -1px -1px 0 rgba(255,255,255,.12), inset 0 0 14px rgba(255,255,255,.1), 0 10px 30px rgba(0,0,0,.5); }
    .lg::after { background: radial-gradient(ellipse 60% 55% at 22% 0%, rgba(255,255,255,.22), transparent 70%); }
  }
  /* Barre d'actions flottante */
  #actions { position: fixed; z-index: 10; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 14px); transform: translateX(-50%);
    display: flex; gap: 4px; padding: 6px; border-radius: 999px; }
  #actions > * { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 88px; padding: 7px 18px; border-radius: 999px; font-size: 11px; font-weight: 600;
    color: var(--text); text-shadow: 0 1px 2px rgba(255,255,255,.4); }
  #actions i { font-size: 20px; height: 24px; display: grid; place-items: center; }
  /* Barre réduite quand on fait défiler vers le bas (comme la barre d'onglets d'iOS 26) : icônes seules, capsule plus petite */
  #actions, #actions > * { transition: padding .3s cubic-bezier(.3,1.3,.5,1), min-width .3s cubic-bezier(.3,1.3,.5,1), font-size .2s, gap .2s; }
  body.bar-min #actions { padding: 4px; }
  body.bar-min #actions > * { min-width: 46px; padding: 6px 10px; font-size: 0; gap: 0; }
  #actions b { font-weight: inherit; }
  #rec.on { background: var(--danger); color: #fff; animation: pulse 1.2s infinite; }
  #rec.on i { color: #fff; }
  @keyframes pulse { 50% { opacity: .65; } }
  #toast { position: fixed; z-index: 60; left: 50%; bottom: calc(var(--bar-h) + env(safe-area-inset-bottom) + 26px); transform: translateX(-50%);
    padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; max-width: 90vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--glass-strong); }
  [hidden] { display: none !important; }

  /* Caméra intégrée, façon appareil photo iOS (boutons en verre sombre) */
  #cam { position: fixed; z-index: 50; inset: 0; background: #000; color: #fff; display: flex; flex-direction: column;
    touch-action: none; user-select: none; -webkit-user-select: none; }
  .cam-glass { background: rgba(255,255,255,.14); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255,255,255,.22); box-shadow: inset 0 1px 0 rgba(255,255,255,.35); }
  .cam-top { position: absolute; z-index: 1; inset: 0 0 auto 0; padding: calc(env(safe-area-inset-top) + 10px) 14px 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .cam-top > div { display: flex; gap: 10px; }
  .cam-top > div:last-child { justify-content: flex-end; }
  .cam-top button { width: 44px; height: 44px; border-radius: 50%; color: #fff; font-size: 20px; }
  #camRec.on { background: var(--danger); border-color: transparent; animation: pulse 1.2s infinite; }
  #cam.rec #camRec { visibility: hidden; }
  #camTimer { font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 600; padding: 6px 14px; border-radius: 999px; }
  #cam[data-mode=photo] #camTimer { visibility: hidden; }
  #cam.rec #camTimer { background: var(--danger); border-color: transparent; }
  .cam-view { flex: 1; position: relative; overflow: hidden; }
  #camView { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .1s; }
  #cam.flash #camView { opacity: 0; }
  .cam-bottom { position: absolute; inset: auto 0 0 0; padding: 0 0 calc(env(safe-area-inset-bottom) + 24px); }
  .modes { display: flex; gap: 22px; height: 38px; align-items: center; transition: transform .3s ease; width: 100%; }
  .modes button { color: #fff; font-size: 13px; font-weight: 600; letter-spacing: .1em; padding: 6px 12px; border-radius: 999px; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .modes button.on { color: #ffd60a; background: rgba(0,0,0,.35); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  #cam.rec .modes { visibility: hidden; }
  .cam-row { display: flex; align-items: center; justify-content: space-between; margin: 12px 20px 0; padding: 12px 18px; border-radius: 999px; }
  #camImport { width: 50px; height: 50px; border-radius: 14px; background: rgba(255,255,255,.12) center / cover; border: 1.5px solid rgba(255,255,255,.7);
    display: grid; place-items: center; font-size: 20px; cursor: pointer; }
  #camImport.thumb i { display: none; }
  #camImport input { display: none; }
  #camFlip { width: 50px; height: 50px; border-radius: 50%; color: #fff; font-size: 20px; }
  #cam.rec #camImport, #cam.rec #camFlip { visibility: hidden; }
  #shutter { width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; padding: 4px; display: grid; place-items: center; }
  #shutter::after { content: ''; width: 100%; height: 100%; border-radius: 50%; background: #fff; transition: all .25s ease; }
  #shutter:active::after { transform: scale(.9); }
  #cam[data-mode=video] #shutter::after { background: var(--danger); }
  #cam.rec #shutter::after { width: 42%; height: 42%; border-radius: 6px; }
  /* Flash : éclair barré (désactivé), avec un « A » (auto), jaune (activé) */
  #camFlash { position: relative; display: grid; place-items: center; }
  #camFlash[data-flash=on] { color: #ffd60a; }
  #camFlash[data-flash=off]::after { content: ''; position: absolute; width: 24px; height: 2px; border-radius: 2px; background: #fff; transform: rotate(-45deg); box-shadow: 0 0 0 1.5px rgba(0,0,0,.35); }
  #camFlash[data-flash=auto]::after { content: 'A'; position: absolute; right: 7px; bottom: 6px; font-size: 10px; font-weight: 800; }
  #cam.screen-flash::after { content: ''; position: fixed; z-index: 10; inset: 0; background: #fff; }
  /* Sélecteur d'objectifs (0,5 · 1 · 2 · 3) : capsule en verre + « goutte » de verre sous l'objectif actif */
  .lenses { position: relative; display: flex; gap: 2px; width: max-content; margin: 0 auto 8px; padding: 3px; border-radius: 999px; touch-action: none;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22);
    -webkit-backdrop-filter: blur(18px) saturate(180%); backdrop-filter: blur(18px) saturate(180%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 1px rgba(255,255,255,.08), 0 6px 20px rgba(0,0,0,.25); }
  .lens-blob { position: absolute; left: 0; top: 3px; bottom: 3px; width: 28px; border-radius: 999px; pointer-events: none;
    background: radial-gradient(120% 90% at 30% 10%, rgba(255,255,255,.3), rgba(24,24,30,.88) 62%);
    box-shadow: inset 0 1px 1px rgba(255,255,255,.6), inset 0 -2px 4px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.3); }
  .lenses button { position: relative; min-width: 28px; height: 26px; padding: 0 5px; border-radius: 999px; background: none;
    color: rgba(255,255,255,.88); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .lenses button.on { color: #ffd60a; }
  #cam.rec .lenses.devices { visibility: hidden; }
  /* Pas de verre sur du verre : le bouton de bascule posé sur la barre en verre a un simple fond */
  .cam-row #camFlip { -webkit-backdrop-filter: none; backdrop-filter: none; background: rgba(255,255,255,.18); }
  /* Visionneuse (fond déjà en verre) : contrôles sans flou, note et lecteur audio en surfaces opaques */
  #viewer .cam-glass { -webkit-backdrop-filter: none; backdrop-filter: none; background: rgba(255,255,255,.16); }
  #viewer .note-big, #viewer .audio-big .ring { -webkit-backdrop-filter: none; backdrop-filter: none;
    background: rgba(24,27,35,.94); border: 1px solid rgba(255,255,255,.1); box-shadow: 0 24px 70px rgba(0,0,0,.45); }
  #viewer .audio-big.playing .ring { box-shadow: 0 0 0 14px rgba(124,192,255,.15), 0 24px 70px rgba(0,0,0,.45); }
  body.cam-open #toast { bottom: auto; top: calc(env(safe-area-inset-top) + 64px); }

  /* Grand écran : menu toujours visible */
  @media (min-width: 900px) {
    #drawer { transform: none; }
    #backdrop, #menuBtn { display: none; }
    body { padding-left: 330px; }
    body.logged-out { padding-left: 0; }
    #actions { left: calc(50% + 165px); }
  }
</style>
</head>
<body>
<header class="top lg">
  <button class="icon" id="menuBtn" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
  <h1 id="title">Mes voyages</h1>
  <button class="icon" id="shareTrip" aria-label="Partager le voyage" hidden><i class="fa-solid fa-share-nodes"></i></button>
  <button class="icon" id="delTrip" aria-label="Supprimer le voyage" hidden><i class="fa-solid fa-trash-can"></i></button>
</header>

<nav id="drawer">
  <button class="me" id="who" aria-label="Modifier mon profil">
    <span class="avatar" id="avatar"></span>
    <span class="me-text"><b id="whoName"></b><small id="whoMail"></small></span>
    <i class="fa-solid fa-pen"></i>
  </button>
  <a class="nav-item" id="homeLink" href="#"><span class="tico"><i class="fa-solid fa-house"></i></span><span><b>Accueil</b></span></a>
  <div id="tripList"></div>
  <form id="new" hidden>
    <input name="name" placeholder="Nom du voyage" required maxlength="60" aria-label="Nom du voyage">
    <div class="icon-pick" id="iconPick" role="radiogroup" aria-label="Icône du voyage"></div>
    <div class="new-actions"><button type="button" id="newCancel">Annuler</button><button class="primary">Créer</button></div>
  </form>
  <button class="new-btn" id="newBtn"><i class="fa-solid fa-plus"></i> Nouveau voyage</button>
  <button class="logout" id="logout"><i class="fa-solid fa-right-from-bracket"></i> Se déconnecter</button>
</nav>
<div id="backdrop"></div>

<main id="main"></main>

<footer id="actions" class="lg" hidden>
  <button id="camBtn"><i class="fa-solid fa-camera"></i>Caméra</button>
  <button id="rec"><i class="fa-solid fa-microphone"></i><b>Audio</b></button>
</footer>
<div id="toast" hidden></div>

<dialog id="editDlg">
  <h3><i class="fa-solid fa-pen"></i> Modifier le voyage</h3>
  <form id="editForm">
    <input name="name" placeholder="Nom du voyage" required maxlength="60" aria-label="Nom du voyage">
    <div class="icon-pick" id="editIcons" role="radiogroup" aria-label="Icône du voyage"></div>
    <p class="login-err" id="editErr" role="alert"></p>
    <div class="new-actions"><button type="button" id="editCancel">Annuler</button><button class="primary">Enregistrer</button></div>
  </form>
</dialog>

<dialog id="shareDlg">
  <h3><i class="fa-solid fa-share-nodes"></i> Partager ce voyage</h3>
  <div class="tabs" id="shareTabs"><button data-kind="share" class="on">Lecture seule</button><button data-kind="invite">Participer</button></div>
  <p id="shareHelp"></p>
  <input id="shareLink" readonly aria-label="Lien d’invitation">
  <div class="dlg-row"><button id="shareCopy">Copier le lien</button><button id="shareSend">Envoyer…</button></div>
  <button id="shareOff">Désactiver ce lien</button>
  <div id="memberBox" hidden><h4>Participants</h4><ul id="memberList"></ul></div>
  <button id="shareClose">Fermer</button>
</dialog>

<div id="viewer" hidden>
  <div id="viewerTrack"></div>
  <div class="viewer-top">
    <button id="viewerClose" class="cam-glass" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button>
    <span id="viewerCount" class="cam-glass"></span>
    <span class="spacer"></span>
  </div>
  <button id="viewerPrev" class="viewer-nav cam-glass" aria-label="Précédent"><i class="fa-solid fa-chevron-left"></i></button>
  <button id="viewerNext" class="viewer-nav cam-glass" aria-label="Suivant"><i class="fa-solid fa-chevron-right"></i></button>
</div>

<div id="cam" hidden>
  <div class="cam-top">
    <div>
      <button id="camClose" class="cam-glass" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button>
      <button id="camFlash" class="cam-glass" data-flash="off" hidden><i class="fa-solid fa-bolt"></i></button>
    </div>
    <span id="camTimer" class="cam-glass">00:00:00</span>
    <div><button id="camRec" class="cam-glass" aria-label="Enregistrer un audio"><i class="fa-solid fa-microphone"></i></button></div>
  </div>
  <div class="cam-view"><video id="camView" autoplay playsinline muted></video></div>
  <div class="cam-bottom">
    <div class="lenses" id="lenses" hidden></div>
    <div class="modes" id="modes"><button data-mode="video">VIDÉO</button><button data-mode="photo">PHOTO</button></div>
    <div class="cam-row cam-glass">
      <label id="camImport" aria-label="Importer depuis la galerie"><i class="fa-solid fa-images"></i><input type="file" multiple accept="image/*,video/*,audio/*,text/plain"></label>
      <button id="shutter" aria-label="Déclencher"></button>
      <button id="camFlip" class="cam-glass" aria-label="Changer de caméra"><i class="fa-solid fa-camera-rotate"></i></button>
    </div>
  </div>
</div>

<script type="module">
import { uploadPresigned } from 'https://esm.sh/@vercel/blob@2.8.0/client';

const $ = s => document.querySelector(s);
const main = $('#main'), toast = $('#toast');
const esc = s => s.replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
// Voyage ouvert : son numéro est dans l'adresse (#12). trips = voyages accessibles, cur = voyage ouvert (avec mon rôle).
const tripId = () => +(location.hash.match(/^#(\d+)$/)?.[1] ?? 0) || null;
let trips = [], cur = null;

async function api(path = '/api/trips', opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'content-type': 'application/json' } });
  const json = await r.json();
  if (r.status === 401) { showLogin(); throw new Error('Connexion requise'); } // session expirée
  if (!r.ok) { alert(json.error || 'Erreur'); throw new Error(json.error); }
  return json;
}

// Connexion (Neon Auth, via le proxy /api/auth/* : le cookie de session est posé sur notre domaine)
let me = null;
const authCall = async (path, body) => {
  const r = await fetch('/api/auth/' + path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {});
  return { ok: r.ok, data: await r.json().catch(() => null) };
};
// Au retour de Google, l'adresse contient un code de vérification à échanger contre la session
async function loadSession() {
  const verifier = new URLSearchParams(location.search).get('neon_auth_session_verifier');
  // disableCookieCache : toujours le profil à jour (le nom vient d'être modifié, par exemple)
  const { data } = await authCall('get-session?disableCookieCache=true' + (verifier ? `&neon_auth_session_verifier=${encodeURIComponent(verifier)}` : ''));
  if (verifier) history.replaceState(null, '', location.pathname + location.hash);
  return data?.user || null;
}
const AUTH_ERRORS = {
  INVALID_EMAIL_OR_PASSWORD: 'E-mail ou mot de passe incorrect.',
  USER_ALREADY_EXISTS: 'Un compte existe déjà avec cet e-mail.',
  USER_ALREADY_EXISTS_USE_ANOTHER_EMAIL: 'Un compte existe déjà avec cet e-mail.',
  PASSWORD_TOO_SHORT: 'Mot de passe trop court (8 caractères minimum).',
  INVALID_EMAIL: 'Adresse e-mail invalide.',
  INVALID_CALLBACKURL: 'Ce site n’est pas encore autorisé dans Neon Auth (domaine de confiance à ajouter).',
  INVALID_ORIGIN: 'Ce site n’est pas encore autorisé dans Neon Auth (domaine de confiance à ajouter).',
};

function showLogin(signup = false) {
  me = null;
  document.body.classList.add('logged-out');
  setMenu(false);
  $('#title').textContent = 'Mes voyages';
  main.innerHTML = `<section class="login">
    <i class="fa-solid fa-suitcase-rolling"></i>
    <h2>${signup ? 'Créer un compte' : 'Connexion'}</h2>
    <p>${location.hash.startsWith('#join=') ? 'Connectez-vous pour rejoindre le voyage auquel vous êtes invité.' : 'Retrouvez vos voyages et vos souvenirs.'}</p>
    <button class="social" id="google"><i class="fa-brands fa-google"></i> Continuer avec Google</button>
    <div class="or">ou</div>
    <form id="loginForm">
      <input name="email" type="email" autocomplete="email" placeholder="E-mail" required>
      <input name="password" type="password" autocomplete="${signup ? 'new-password' : 'current-password'}" placeholder="Mot de passe" minlength="8" required>
      <button>${signup ? 'Créer mon compte' : 'Se connecter'}</button>
    </form>
    <p class="login-err" id="loginErr" role="alert"></p>
    <button class="link" id="swap">${signup ? 'J’ai déjà un compte' : 'Créer un compte'}</button>
  </section>`;
  const fail = d => {
    const code = /invalid origin/i.test(d?.message || '') ? 'INVALID_ORIGIN' : d?.code;
    $('#loginErr').textContent = AUTH_ERRORS[code] || d?.message || 'Connexion impossible. Réessayez.';
  };
  $('#swap').onclick = () => showLogin(!signup);
  $('#google').onclick = async () => {
    const { data } = await authCall('sign-in/social', { provider: 'google', callbackURL: location.origin + '/' });
    if (!data?.url) return fail(data);
    // Le détour par Google fait perdre le « #… » de l'adresse (lien d'invitation) : on le garde pour le retour
    try { sessionStorage.setItem('pendingHash', location.hash); } catch {}
    location.href = data.url;
  };
  $('#loginForm').onsubmit = async e => {
    e.preventDefault();
    const email = e.target.email.value.trim(), password = e.target.password.value;
    const { ok, data } = await authCall(signup ? 'sign-up/email' : 'sign-in/email', signup ? { name: email.split('@')[0], email, password } : { email, password });
    if (!ok) return fail(data);
    boot();
  };
}

// Prénom et nom : demandés après la création du compte (à l'inscription par e-mail, le nom vaut d'abord
// le début de l'adresse : c'est le signe qu'il reste à renseigner). Modifiables ensuite depuis le menu.
const nameMissing = u => !u.name?.trim() || u.name === u.email?.split('@')[0];
function showProfile() {
  document.body.classList.add('logged-out');
  setMenu(false);
  const [first = '', ...rest] = nameMissing(me) ? [] : me.name.trim().split(' ');
  main.innerHTML = `<section class="login">
    <i class="fa-solid fa-user"></i>
    <h2>Bienvenue !</h2>
    <p>Comment vous appelez-vous ?</p>
    <form id="profileForm">
      <input name="first" autocomplete="given-name" placeholder="Prénom" value="${esc(first)}" required>
      <input name="last" autocomplete="family-name" placeholder="Nom" value="${esc(rest.join(' '))}" required>
      <button>Continuer</button>
    </form>
    <p class="login-err" id="loginErr" role="alert"></p>
    ${nameMissing(me) ? '' : '<button class="link" id="profileCancel">Annuler</button>'}
  </section>`;
  if ($('#profileCancel')) $('#profileCancel').onclick = enterApp;
  $('#profileForm').onsubmit = async e => {
    e.preventDefault();
    const name = `${e.target.first.value.trim()} ${e.target.last.value.trim()}`;
    const { ok, data } = await authCall('update-user', { name });
    if (!ok) { $('#loginErr').textContent = data?.message || 'Enregistrement impossible. Réessayez.'; return; }
    me.name = name;
    enterApp();
  };
}

function enterApp() {
  document.body.classList.remove('logged-out');
  $('#whoName').textContent = me.name;
  $('#whoMail').textContent = me.email || '';
  $('#avatar').textContent = me.name.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase(); // initiales
  route();
}

async function boot() {
  // Retour de Google : on remet le « #… » mis de côté avant le détour (lien d'invitation)
  try {
    const h = sessionStorage.getItem('pendingHash');
    sessionStorage.removeItem('pendingHash');
    if (h && location.hash.length < 2) history.replaceState(null, '', location.pathname + location.search + h);
  } catch {}
  me = await loadSession();
  // Sans compte : écran de connexion, sauf pour un lien d'invitation (route() s'en charge)
  if (!me) { document.body.classList.add('logged-out'); return route(); }
  if (nameMissing(me)) return showProfile();
  enterApp();
}

// Menu
// Accolades volontaires : un onclick qui renvoie false annule le clic (le lien ne s'ouvrait plus).
const setMenu = open => { document.body.classList.toggle('menu-open', open); };
$('#menuBtn').onclick = () => setMenu(true);
$('#backdrop').onclick = () => setMenu(false);

// Icônes proposées à la création d'un voyage (la première est celle par défaut)
const TRIP_ICONS = ['fa-suitcase-rolling', 'fa-plane', 'fa-umbrella-beach', 'fa-mountain-sun', 'fa-city', 'fa-tree',
  'fa-sailboat', 'fa-car-side', 'fa-train', 'fa-campground', 'fa-person-hiking', 'fa-bicycle',
  'fa-snowflake', 'fa-landmark', 'fa-utensils', 'fa-wine-glass', 'fa-camera-retro', 'fa-heart'];
const tripIcon = t => t.icon || TRIP_ICONS[0];
const tripHue = t => Math.round(rand(t.name, 'hue') * 360); // couleur stable par voyage

// Menu : mes voyages, puis ceux auxquels je participe (avec le nom de leur propriétaire)
const tripRow = (t, id) => `<a href="#${t.id}" class="${t.id === id ? 'active' : ''}">
  <span class="tico" style="--hue:${tripHue(t)}"><i class="fa-solid ${tripIcon(t)}"></i></span>
  <span><b>${esc(t.name)}</b><small>${t.role === 'member' ? `Partagé${t.owner ? ' par ' + esc(t.owner) : ''} · ` : ''}${t.count} souvenir${t.count > 1 ? 's' : ''}</small></span></a>`;
async function loadTrips() {
  trips = await api();
  const id = tripId(), mine = trips.filter(t => t.role === 'owner'), shared = trips.filter(t => t.role === 'member');
  $('#homeLink').classList.toggle('active', location.hash.length < 2);
  $('#tripList').innerHTML = `<div class="nav-label">Mes voyages</div>`
    + (mine.map(t => tripRow(t, id)).join('') || '<p class="empty-list">Aucun voyage pour l’instant.</p>')
    + (shared.length ? `<div class="nav-label">Partagés avec moi</div>` + shared.map(t => tripRow(t, id)).join('') : '');
}
// Un lien du menu (Accueil ou voyage) : on ferme le menu, puis on y va (ou on recharge si on y est déjà)
$('#drawer').onclick = e => {
  const a = e.target.closest('a');
  if (!a) return;
  e.preventDefault();
  setMenu(false);
  if (location.hash === a.hash) route(); else location.hash = a.hash;
};

// Création d'un voyage : le bouton déplie un petit formulaire (nom + icône)
$('#iconPick').innerHTML = TRIP_ICONS.map((ic, i) =>
  `<label><input type="radio" name="icon" value="${ic}" ${i ? '' : 'checked'}><i class="fa-solid ${ic}"></i></label>`).join('');
function openNew(open = true) {
  $('#new').hidden = !open;
  $('#newBtn').hidden = open;
  if (open) { setMenu(true); $('#new').elements.name.focus(); }
}
$('#newBtn').onclick = () => openNew();
$('#newCancel').onclick = () => openNew(false);
$('#new').onsubmit = async e => {
  e.preventDefault();
  const name = e.target.elements.name.value.trim(), icon = e.target.elements.icon.value;
  const t = await api('/api/trips', { method: 'POST', body: JSON.stringify({ name, icon }) });
  e.target.reset();
  openNew(false);
  setMenu(false);
  location.hash = t.id;
};

// Localisation : position actuelle (gardée 2 min) pour ce qu'on capture ; null si refusée ou indisponible
let lastPos = null;
function here() {
  if (lastPos && Date.now() - lastPos.t < 120000) return Promise.resolve(lastPos);
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res(lastPos = { lat: p.coords.latitude, lng: p.coords.longitude, t: Date.now() }),
      () => res(null), { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
  });
}

// Coordonnées GPS des données EXIF d'une photo JPEG importée (null si absentes)
async function exifGps(file) {
  if (!/jpe?g/i.test(file.type)) return null;
  const v = new DataView(await file.slice(0, 256 * 1024).arrayBuffer());
  if (v.byteLength < 4 || v.getUint16(0) !== 0xFFD8) return null;
  for (let o = 2; o + 10 < v.byteLength && v.getUint8(o) === 0xFF; o += 2 + v.getUint16(o + 2)) {
    if (v.getUint16(o) !== 0xFFE1 || v.getUint32(o + 4) !== 0x45786966) continue; // segment APP1 « Exif »
    const t = o + 10, le = v.getUint16(t) === 0x4949;
    const u16 = p => v.getUint16(t + p, le), u32 = p => v.getUint32(t + p, le);
    const entry = (ifd, id) => { for (let i = 0, n = u16(ifd); i < n; i++) if (u16(ifd + 2 + i * 12) === id) return ifd + 2 + i * 12; return null; };
    const gpsPtr = entry(u32(4), 0x8825);
    if (gpsPtr === null) return null;
    const gps = u32(gpsPtr + 8);
    const coord = (valId, refId) => {
      const e = entry(gps, valId), r = entry(gps, refId);
      if (e === null || r === null) return NaN;
      const p = u32(e + 8), [d, m, s] = [0, 8, 16].map(k => u32(p + k) / u32(p + k + 4));
      return (d + m / 60 + s / 3600) * (/[SW]/.test(String.fromCharCode(v.getUint8(t + r + 8))) ? -1 : 1);
    };
    const lat = coord(2, 1), lng = coord(4, 3);
    return Number.isFinite(lat) && Number.isFinite(lng) ? { lat, lng } : null;
  }
  return null;
}

// Envoi des médias. live = pris dans l'appli (position actuelle) ; sinon position lue dans la photo importée.
// Le fichier part dans Vercel Blob, puis ses informations (type, position) sont enregistrées dans la base.
// Une note (ou un .txt importé) ne crée pas de fichier : son texte va directement dans la base.
const kindOfFile = f => kindOf(f.name) || { image: 'img', video: 'vid', audio: 'aud' }[f.type.split('/')[0]];
async function send(files, live) {
  const id = cur?.id;
  if (!id) return;
  try {
    for (const [i, f] of [...files].entries()) {
      toast.hidden = false;
      toast.textContent = `Envoi ${i + 1}/${files.length} : ${f.name}…`;
      const kind = kindOfFile(f);
      if (!kind) continue;
      const pos = live ? await here() : await exifGps(f).catch(() => null);
      const media = { tripId: id, kind, lat: pos?.lat, lng: pos?.lng };
      if (kind === 'note') media.text = await f.text();
      else media.pathname = (await uploadPresigned(`trips/id-${id}/${f.name}`, f, { access: 'private', handleUploadUrl: '/api/upload' })).pathname;
      await api('/api/media', { method: 'POST', body: JSON.stringify(media) });
    }
  } catch (e) {
    alert('Échec de l’envoi : ' + e.message);
  }
  toast.hidden = true;
  if (tripId() === id) loadItems(id);
}
$('#camImport input').onchange = e => send(e.target.files).finally(() => e.target.value = '');

// Caméra intégrée, façon appareil photo iOS : glisser pour passer de PHOTO à VIDÉO
const cam = $('#cam'), camView = $('#camView'), camTimer = $('#camTimer'), modes = $('#modes'), lensesEl = $('#lenses'), flashBtn = $('#camFlash');
let camStream, camRec, camTick, camReq = 0, facing = 'environment', lensId = null;
const wait = ms => new Promise(r => setTimeout(r, ms));
const videoTrack = () => camStream?.getVideoTracks()[0];

async function startCam() {
  const req = ++camReq; // ignore les demandes dépassées (changement de mode rapide)
  camStream?.getTracks().forEach(t => t.stop());
  let stream;
  try {
    const which = lensId && facing === 'environment' ? { deviceId: { exact: lensId } } : { facingMode: facing };
    stream = await navigator.mediaDevices.getUserMedia({
      video: { ...which, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: cam.dataset.mode === 'video',
    });
  } catch (e) {
    alert('Impossible d’accéder à la caméra : ' + e.message);
    return closeCam();
  }
  if (req !== camReq || cam.hidden) return stream.getTracks().forEach(t => t.stop());
  camView.srcObject = camStream = stream;
  cam.classList.toggle('front', facing === 'user');
  await setupLenses();
  applyTorch();
}

// Objectifs : 1) zoom matériel si la caméra le propose (Chrome Android, Safari récent),
// 2) sinon bascule entre objectifs physiques repérés par leur nom (ultra grand-angle, téléobjectif),
// 3) sinon zoom numérique (photo uniquement : on recadre le centre de l'image).
let lens = { kind: 'none', stops: [], z: 1, min: 1, max: 1, devices: [] };

async function backLenses() {
  const all = (await navigator.mediaDevices.enumerateDevices())
    .filter(d => d.kind === 'videoinput' && !/front|avant|user|facetime/i.test(d.label));
  const out = [];
  for (const d of all) {
    // Les caméras « Dual » / « Triple » d'iOS sont virtuelles : on garde les objectifs réels
    const z = /ultra/i.test(d.label) ? 0.5 : /t[ée]l[ée]/i.test(d.label) ? 2 : /dual|triple|double/i.test(d.label) ? null : 1;
    if (z !== null && !out.some(o => o.z === z)) out.push({ z, id: d.deviceId });
  }
  return out.sort((a, b) => a.z - b.z);
}

async function setupLenses() {
  const track = videoTrack(), caps = track?.getCapabilities?.() || {};
  torchOK = !!caps.torch;
  let devs;
  if (caps.zoom && caps.zoom.max > caps.zoom.min) {
    const { min, max } = caps.zoom;
    const stops = [...new Set([min < 1 ? min : 1, 1, 2, 3, 5])].filter(v => v >= min && v <= max);
    lens = { kind: 'hw', stops, min, max, z: track.getSettings().zoom || 1 };
  } else if (facing === 'environment' && (devs = await backLenses()).length > 1) {
    const cur = devs.find(d => d.id === track.getSettings().deviceId) || devs.find(d => d.z === 1) || devs[0];
    lens = { kind: 'dev', stops: devs.map(d => d.z), devices: devs, z: cur.z };
  } else if (cam.dataset.mode === 'photo') {
    lens = { kind: 'digital', stops: [1, 2, 3], min: 1, max: 5, z: 1 };
  } else {
    lens = { kind: 'none', stops: [], z: 1 };
  }
  applyZoomView();
  renderLenses();
  renderFlash();
}

function setZoom(z, done) {
  if (lens.kind === 'dev') {
    // Objectifs physiques : on affiche le plus proche, et on change de caméra au lâcher
    const d = lens.devices.reduce((a, b) => Math.abs(b.z - z) < Math.abs(a.z - z) ? b : a);
    lens.z = d.z;
    renderLenses();
    if (done && !camRec && d.id !== videoTrack()?.getSettings().deviceId) { lensId = d.id; startCam(); }
    return;
  }
  lens.z = Math.min(lens.max, Math.max(lens.min, z));
  renderLenses();
  if (lens.kind === 'hw') videoTrack()?.applyConstraints({ advanced: [{ zoom: lens.z }] }).catch(() => {});
  applyZoomView();
}

function applyZoomView() {
  const z = lens.kind === 'digital' ? lens.z : 1;
  camView.style.transform = `scale(${facing === 'user' ? -z : z}, ${z})`; // miroir pour la caméra avant
}

const fmtZ = z => String(Math.round(z * 10) / 10).replace('.', ',');
let lensActive = null;
function renderLenses() {
  lensesEl.hidden = !lens.stops.length;
  lensesEl.classList.toggle('devices', lens.kind === 'dev');
  // On ne reconstruit les boutons que si la liste d'objectifs change (sinon la goutte perdrait son animation)
  const key = lens.stops.join();
  if (lensesEl.dataset.key !== key) {
    lensesEl.dataset.key = key;
    lensesEl.innerHTML = '<span class="lens-blob"></span>' + lens.stops.map(s => `<button data-z="${s}"></button>`).join('');
    lensActive = null;
  }
  const active = lens.stops.reduce((a, s) => lens.z >= s - 0.05 ? s : a, lens.stops[0]);
  lensesEl.querySelectorAll('button').forEach(b => {
    const s = +b.dataset.z, on = s === active;
    b.classList.toggle('on', on);
    b.textContent = on ? fmtZ(lens.z) + '×' : fmtZ(s);
  });
  placeBlob(active);
}

// La goutte de verre glisse vers le nouvel objectif en s'étirant, puis rebondit en place
function placeBlob(active) {
  const blob = lensesEl.querySelector('.lens-blob'), b = lensesEl.querySelector(`[data-z="${active}"]`);
  if (!blob || !b) return;
  const to = b.offsetLeft, from = parseFloat(blob.dataset.x ?? to);
  blob.dataset.x = to;
  blob.style.width = b.offsetWidth + 'px';
  blob.style.transform = `translateX(${to}px)`;
  const changed = lensActive !== null && active !== lensActive;
  lensActive = active;
  if (!changed) return;
  blob.animate([
    { transform: `translateX(${from}px) scale(1)` },
    { transform: `translateX(${(from + to) / 2}px) scale(1.4, .78)`, offset: .45 },
    { transform: `translateX(${to}px) scale(.9, 1.1)`, offset: .78 },
    { transform: `translateX(${to}px) scale(1)` },
  ], { duration: 420, easing: 'cubic-bezier(.3,.7,.4,1)' });
  b.animate([{ transform: 'scale(.6)' }, { transform: 'scale(1.18)', offset: .6 }, { transform: 'scale(1)' }], { duration: 320, easing: 'ease-out' });
}

// Toucher un objectif pour y aller, ou glisser sur la barre pour zoomer en continu (à gauche = zoomer, comme la molette d'iOS)
let lensDrag = null;
lensesEl.addEventListener('pointerdown', e => {
  lensDrag = { x: e.clientX, z0: lens.z, moved: false };
  lensesEl.setPointerCapture(e.pointerId);
});
lensesEl.addEventListener('pointermove', e => {
  if (!lensDrag) return;
  const dx = e.clientX - lensDrag.x;
  if (Math.abs(dx) > 6) lensDrag.moved = true;
  if (lensDrag.moved) setZoom(lensDrag.z0 * Math.exp(-dx / 90), false);
});
lensesEl.addEventListener('pointerup', e => {
  if (!lensDrag) return;
  const { moved } = lensDrag;
  lensDrag = null;
  if (moved) return setZoom(lens.z, true);
  const b = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-z]');
  if (b) setZoom(+b.dataset.z, true);
});
lensesEl.addEventListener('pointercancel', () => { lensDrag = null; });
// Glisser sur les objectifs ne doit pas faire passer de PHOTO à VIDÉO
['touchstart', 'touchend'].forEach(t => lensesEl.addEventListener(t, e => e.stopPropagation()));

// Flash : désactivé / auto / activé en photo, désactivé / activé (lampe continue) en vidéo.
// Caméra arrière : vraie lampe si le navigateur y a accès. Caméra avant : écran blanc (« flash Retina »).
let flashMode = 'off', torchOK = false;
const FLASH_CYCLE = { photo: ['off', 'auto', 'on'], video: ['off', 'on'] };
function renderFlash() {
  const mode = cam.dataset.mode;
  if (mode === 'video' && flashMode === 'auto') flashMode = 'off';
  flashBtn.hidden = !(torchOK || (mode === 'photo' && facing === 'user'));
  flashBtn.dataset.flash = flashMode;
  flashBtn.setAttribute('aria-label', 'Flash : ' + { off: 'désactivé', auto: 'automatique', on: 'activé' }[flashMode]);
}
function applyTorch(on = cam.dataset.mode === 'video' && flashMode === 'on') {
  if (torchOK) videoTrack()?.applyConstraints({ advanced: [{ torch: on }] }).catch(() => {});
}
flashBtn.onclick = () => {
  const cycle = FLASH_CYCLE[cam.dataset.mode];
  flashMode = cycle[(cycle.indexOf(flashMode) + 1) % cycle.length];
  renderFlash();
  applyTorch();
};

// Mode auto : on mesure la luminosité moyenne de l'aperçu
function isDark() {
  const c = document.createElement('canvas');
  c.width = c.height = 16;
  const g = c.getContext('2d');
  g.drawImage(camView, 0, 0, 16, 16);
  const d = g.getImageData(0, 0, 16, 16).data;
  let sum = 0;
  for (let i = 0; i < d.length; i += 4) sum += d[i] * .3 + d[i + 1] * .59 + d[i + 2] * .11;
  return sum / 256 < 70;
}

function setMode(mode) {
  if (camRec || mode === cam.dataset.mode) return;
  cam.dataset.mode = mode;
  modes.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  centerMode();
  startCam();
}

// Centre le mode actif sous l'aperçu, comme le sélecteur d'iOS
function centerMode() {
  const on = modes.querySelector('.on');
  if (on) modes.style.transform = `translateX(${modes.offsetWidth / 2 - on.offsetLeft - on.offsetWidth / 2}px)`;
}
addEventListener('resize', centerMode);

function openCam() {
  here(); // demande la position dès l'ouverture, pour qu'elle soit prête au déclenchement
  cam.hidden = false;
  document.body.classList.add('cam-open');
  cam.dataset.mode = '';
  setMode('photo');
}

function closeCam() {
  camRec?.stop(); // une vidéo en cours est enregistrée, pas perdue
  camReq++;
  camStream?.getTracks().forEach(t => t.stop());
  camStream = null;
  camView.srcObject = null;
  cam.hidden = true;
  cam.classList.remove('screen-flash');
  document.body.classList.remove('cam-open');
}

async function takePhoto() {
  const vw = camView.videoWidth, vh = camView.videoHeight;
  if (!vw) return;
  const fire = flashMode === 'on' || (flashMode === 'auto' && isDark());
  if (fire) {
    if (torchOK && facing === 'environment') { applyTorch(true); await wait(500); } // laisse l'exposition s'adapter à la lumière
    else { cam.classList.add('screen-flash'); await wait(300); }
  }
  const z = lens.kind === 'digital' ? lens.z : 1;
  const c = document.createElement('canvas');
  c.width = vw;
  c.height = vh;
  c.getContext('2d').drawImage(camView, (vw - vw / z) / 2, (vh - vh / z) / 2, vw / z, vh / z, 0, 0, vw, vh);
  if (fire) { applyTorch(false); cam.classList.remove('screen-flash'); }
  cam.classList.add('flash');
  setTimeout(() => cam.classList.remove('flash'), 120);
  c.toBlob(b => {
    // Miniature de la dernière photo, comme sur iOS
    $('#camImport').style.backgroundImage = `url(${URL.createObjectURL(b)})`;
    $('#camImport').classList.add('thumb');
    send([new File([b], `photo-${Date.now()}.jpg`, { type: 'image/jpeg' })], true);
  }, 'image/jpeg', 0.9);
}

const hms = s => [s / 3600, s / 60 % 60, s % 60].map(n => String(Math.floor(n)).padStart(2, '0')).join(':');

// Enregistre un flux jusqu'à stop(), puis envoie le fichier (vidéo et audio)
function record(stream, prefix, extOf, onStop) {
  const r = new MediaRecorder(stream), chunks = [];
  r.ondataavailable = e => chunks.push(e.data);
  r.onstop = () => {
    const type = (r.mimeType || (stream.getVideoTracks().length ? 'video/webm' : 'audio/webm')).split(';')[0];
    onStop();
    send([new File(chunks, `${prefix}-${Date.now()}.${extOf(type)}`, { type })], true);
  };
  r.start();
  return r;
}

function toggleVideo() {
  if (camRec) return camRec.stop();
  if (!camStream) return;
  const start = Date.now();
  camRec = record(camStream, 'video', t => t.includes('mp4') ? 'mp4' : 'webm', () => {
    camRec = null;
    clearInterval(camTick);
    camTimer.textContent = hms(0);
    cam.classList.remove('rec');
  });
  cam.classList.add('rec');
  camTick = setInterval(() => { camTimer.textContent = hms((Date.now() - start) / 1000); }, 500);
}

$('#camBtn').onclick = openCam;
$('#camClose').onclick = closeCam;
$('#camFlip').onclick = () => { if (camRec) return; facing = facing === 'user' ? 'environment' : 'user'; lensId = null; startCam(); };
$('#shutter').onclick = () => { cam.dataset.mode === 'photo' ? takePhoto() : toggleVideo(); };
modes.onclick = e => { if (e.target.dataset.mode) setMode(e.target.dataset.mode); };
// Glisser à droite -> VIDÉO, à gauche -> PHOTO
let touchX = null;
// Un deuxième doigt annule le glissement (c'est un pincement)
cam.addEventListener('touchstart', e => { touchX = e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });
cam.addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  touchX = null;
  if (Math.abs(dx) > 50) setMode(dx > 0 ? 'video' : 'photo');
});

// Pincer l'aperçu pour zoomer : même zoom que la barre d'objectifs
let camPinch = null;
const camViewBox = $('.cam-view');
camViewBox.addEventListener('touchstart', e => {
  if (e.touches.length === 2 && lens.stops.length) camPinch = { d0: dist(...e.touches), z0: lens.z };
}, { passive: true });
camViewBox.addEventListener('touchmove', e => {
  if (camPinch && e.touches.length === 2) setZoom(camPinch.z0 * dist(...e.touches) / camPinch.d0, false);
}, { passive: true });
camViewBox.addEventListener('touchend', e => {
  if (camPinch && e.touches.length < 2) { camPinch = null; setZoom(lens.z, true); }
});
cam.addEventListener('gesturestart', e => e.preventDefault()); // empêche Safari de zoomer toute la page

// Enregistrement audio (bouton de la barre du bas et bouton de la caméra)
let rec;
const recBtns = document.querySelectorAll('#rec, #camRec');
function setRecUI(on) {
  recBtns.forEach(b => {
    b.classList.toggle('on', on);
    b.querySelector('i').className = `fa-solid ${on ? 'fa-stop' : 'fa-microphone'}`;
    const label = b.querySelector('b');
    if (label) label.textContent = on ? 'Arrêter' : 'Audio';
  });
}
recBtns.forEach(b => b.onclick = async () => {
  if (rec) return rec.stop();
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  rec = record(stream, 'audio', t => t.includes('mp4') ? 'm4a' : t.includes('ogg') ? 'ogg' : 'weba', () => {
    stream.getTracks().forEach(t => t.stop());
    rec = null;
    setRecUI(false);
  });
  setRecUI(true);
});

// Propriétaire : supprimer le voyage. Participant : le quitter (le voyage et ses médias restent).
$('#delTrip').onclick = async () => {
  const owner = cur.role === 'owner';
  if (!confirm(owner ? `Supprimer « ${cur.name} » et tout son contenu ?` : `Quitter le voyage « ${cur.name} » ?`)) return;
  await api(`/api/trips?id=${cur.id}`, { method: 'DELETE' });
  location.hash = '';
};

// Affichage d'un voyage
const SHEET_HTML = `<div class="map-sheet" id="mapSheet" hidden><div class="sheet-head"><b id="sheetTitle"></b>
  <button id="sheetOpen" hidden>Ouvrir <i class="fa-solid fa-chevron-right"></i></button>
  <button id="sheetClose" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button></div><div class="sheet-strip" id="sheetStrip"></div></div>`;

// Type d'un fichier d'après son extension
const kindOf = name => {
  const ext = name.split('.').pop().toLowerCase();
  return /^(jpe?g|png|gif|webp|avif|heic)$/.test(ext) ? 'img' : /^(mp4|mov|webm|m4v)$/.test(ext) ? 'vid'
    : /^(weba|m4a|mp3|wav|ogg|aac|opus)$/.test(ext) ? 'aud' : ext === 'txt' ? 'note' : null;
};
const fmtDate = d => new Date(d).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' });
// Ligne de la base → média pour la visionneuse et la carte
const toMedia = r => ({ id: r.id, kind: r.kind, src: r.src, text: r.text || '', date: fmtDate(r.created_at), trip: r.trip, tripId: r.trip_id,
  ...(r.lat !== null ? { lat: r.lat, lng: r.lng } : {}) });

// Accueil : bonjour, quelques chiffres, les voyages en cartes illustrées, puis la carte de tous les souvenirs
const fmtDays = new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
const plural = (n, word) => `<b>${n}</b> ${word}${n > 1 ? 's' : ''}`;
function tripCard(t) {
  const dates = t.firstAt ? fmtDays.formatRange(new Date(t.firstAt), new Date(t.lastAt)) : 'Pas encore de souvenir';
  // Sans photo : l'icône du voyage sur un dégradé à sa couleur
  return `<a class="trip-card" href="#${t.id}" style="--hue:${tripHue(t)}">
    ${t.cover ? `<img src="${t.cover}" loading="lazy" alt="">` : `<i class="fa-solid ${tripIcon(t)}"></i>`}
    ${t.role === 'member' ? `<span class="badge"><i class="fa-solid fa-user-group"></i> ${t.owner ? esc(t.owner) : 'Partagé'}</span>` : ''}
    <span class="info"><b><i class="fa-solid ${tripIcon(t)}"></i> ${esc(t.name)}</b><small>${dates}</small>${t.count ? `<small>${t.count} souvenir${t.count > 1 ? 's' : ''}</small>` : ''}</span></a>`;
}

// Bande de miniatures (aperçu d'un lieu sur la carte, derniers souvenirs) : un appui ouvre la visionneuse sur ces médias
function fillStrip(box, items, html = (m, i) => `<button class="sheet-item ${m.kind}" data-i="${i}">${m.kind === 'vid'
  ? `<video src="${m.src}#t=0.1" muted playsinline preload="metadata"></video><i class="fa-solid fa-play badge"></i>` : thumbHTML(m)}</button>`) {
  box.innerHTML = items.map(html).join('');
  box.onclick = e => { const b = e.target.closest('[data-i]'); if (b) openViewer(items, +b.dataset.i); };
}

// Carte d'un « dernier souvenir » : une présentation par type (photo, vidéo, note, audio), avec le voyage en bas
function memoryCard(m, i) {
  const t = trips.find(t => t.id === m.tripId);
  const body = m.kind === 'img' ? `<img src="${m.src}" loading="lazy" alt="">`
    : m.kind === 'vid' ? `<video src="${m.src}#t=0.1" muted playsinline preload="metadata"></video><span class="play-badge"><i class="fa-solid fa-play"></i></span>`
    : m.kind === 'note' ? `<i class="fa-solid fa-quote-left"></i><p>${esc(m.text)}</p>`
    : `<span class="mem-ring"><i class="fa-solid fa-play"></i></span><span class="mem-kind"><i class="fa-solid fa-microphone"></i> Audio</span>`;
  return `<button class="mem ${m.kind}" data-i="${i}" style="--hue:${t ? tripHue(t) : 211}">${body}
    <small class="cap"><i class="fa-solid ${t ? tripIcon(t) : 'fa-suitcase-rolling'}"></i> ${esc(m.trip || '')}</small></button>`;
}
async function showHome() {
  const total = trips.reduce((n, t) => n + t.count, 0);
  main.innerHTML = `<section class="home">
    <h2 class="home-title">Bonjour ${esc(me.name)}</h2>
    <p class="home-stats">${plural(trips.length, 'voyage')} · ${plural(total, 'souvenir')}<span id="places"></span></p>
    <div class="trip-cards">${trips.map(tripCard).join('')}
      <button class="trip-card new" id="newCard"><i class="fa-solid fa-plus"></i><span class="info"><b>Nouveau voyage</b></span></button></div>
    <div id="recentBox" hidden><h3 class="home-h">Derniers souvenirs</h3><div class="recent" id="recent"></div></div>
    <h3 class="home-h">Sur la carte</h3>
    <div id="mapTab" class="home-map"><div id="map"></div>${SHEET_HTML}
    <p class="map-empty" hidden>Aucun souvenir localisé pour l’instant.</p></div></section>`;
  $('#newCard').onclick = () => openNew();
  const { located, recent } = await api('/api/trips?all=1');
  if (location.hash.length > 1) return;
  // Derniers souvenirs ajoutés, tous voyages confondus (y compris par les autres participants)
  $('#recentBox').hidden = !recent.length;
  fillStrip($('#recent'), recent.map(toMedia), memoryCard);
  tripMedia = located.map(toMedia);
  // Lieux : positions distinctes à environ 1 km près
  const places = new Set(tripMedia.map(m => `${m.lat.toFixed(2)},${m.lng.toFixed(2)}`)).size;
  if (places) $('#places').innerHTML = ` · ${plural(places, 'lieu').replace('lieus', 'lieux')}`;
  showMap();
}

// Page d'un voyage : onglets Souvenirs / Carte. readonly = vue partagée (pas de champ de note)
function tripPage(readonly) {
  main.innerHTML = `${readonly ? '<p class="shared-by" id="sharedBy"></p>' : ''}
    <div class="tabs" id="tabs"><button data-tab="wall" class="on">Souvenirs</button><button data-tab="map">Carte</button></div>
    <section id="wall">${readonly ? '' : '<form id="note"><textarea name="text" rows="1" placeholder="Écrire une note…"></textarea><button>Ajouter</button></form>'}
    <div class="grid" id="items"></div></section>
    <section id="mapTab" hidden><div id="map"></div>${SHEET_HTML}
    <p class="map-empty" hidden>Aucun souvenir localisé pour l’instant.${readonly ? '' : '<br>Les photos, vidéos, audios et notes pris dans l’appli seront placés ici.'}</p></section>`;
  $('#tabs').onclick = e => {
    const tab = e.target.dataset.tab;
    if (!tab) return;
    $('#tabs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    $('#wall').hidden = tab !== 'wall';
    $('#mapTab').hidden = tab !== 'map';
    showMap();
  };
}

// Voyage ouvert par un lien d'invitation : lecture seule, sans compte
async function showShared(token) {
  $('#delTrip').hidden = $('#shareTrip').hidden = $('#actions').hidden = true;
  const r = await fetch('/api/trips?token=' + encodeURIComponent(token));
  if (location.hash !== '#share=' + encodeURIComponent(token)) return;
  if (!r.ok) {
    $('#title').textContent = 'Mes voyages';
    main.innerHTML = '<p class="empty">Ce lien de partage n’est plus valide.<br>Demandez un nouveau lien à la personne qui vous l’a envoyé.</p>';
    return;
  }
  const { name, owner, media } = await r.json();
  $('#title').textContent = name;
  tripPage(true);
  $('#sharedBy').innerHTML = `<i class="fa-solid fa-eye"></i> Voyage partagé${owner ? ' par ' + esc(owner) : ''} · lecture seule`;
  renderItems(media, true);
}

function showTrip(trip) {
  tripPage(false);
  // Voyage d'un autre, auquel je participe : on le signale
